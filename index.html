function viewAlertas() {
  const A = computeAlerts();
  const groups = [['alta', 'Atender ahora'], ['media', 'Próximos días'], ['baja', 'Para tener en cuenta']];
  const body = A.length
    ? groups.map(([k, t]) => { const g = A.filter((a) => a.lvl === k); return g.length ? `<div class="panel"><h3>${t} <span class="badge">${g.length}</span></h3><div class="alert-list">${g.map(alertItem).join('')}</div></div>` : ''; }).join('')
    : '<div class="panel"><div class="empty">Sin alertas pendientes. Todo en orden.</div></div>';
  return `<div class="page">${pageHead('Alertas', 'Stock bajo, cosechas próximas, contratos por vencer, aplicaciones pendientes, mantenimiento y clima. Ajusta los plazos de aviso en Configuración.', '<button class="btn" data-go="config">Ajustar avisos</button>')}${body}</div>`;
}

/* ---------- Panel principal ---------- */
function viewDashboard() {
  const s = S(); const cy = new Date().getFullYear(); const t = today();
  if (!all('lotes').length && !all('campanas').length) {
    return `<div class="page">${pageHead(s.finca, 'Empieza registrando tus lotes y la campaña que tienes sembrada. También puedes explorar el sistema con datos de ejemplo.')}
      <div class="panel"><h3>Primeros pasos</h3>
        <div class="tiles">
          <button class="tile" data-new="lotes">${ico('map')}<b>Registrar un lote</b><span>Nombre, área, suelo y ubicación</span></button>
          <button class="tile" data-new="campanas">${ico('sprout')}<b>Registrar una campaña</b><span>Cultivo, siembra y cosecha estimada</span></button>
          <button class="tile" data-go="config">${ico('sliders')}<b>Configurar la finca</b><span>Moneda, ubicación y avisos</span></button>
          <button class="tile" data-act="demo">${ico('chart')}<b>Explorar con datos de ejemplo</b><span>Tres años de campañas simuladas</span></button>
        </div></div></div>`;
  }
  const activas = where('campanas', (c) => c.estado === 'En curso').sort((a, b) => String(a.fecha_cosecha_est || '9').localeCompare(String(b.fecha_cosecha_est || '9')));
  const proximas = where('campanas', (c) => c.estado === 'Planificada' && c.fecha_siembra && daysBetween(t, c.fecha_siembra) <= 45);
  const ha = sum(activas, (c) => resumen(c).area);
  const L = ledger().filter((l) => yearOf(l.fecha) === cy);
  const ing = sum(L, (l) => l.ingreso); const egr = sum(L, (l) => l.egreso);
  const cerr = resumenes().filter((r) => r.cerrada && r.costo);
  const ult = cerr.length ? Math.max(...cerr.map((r) => r.anio || 0)) : null;
  const cu = cerr.filter((r) => r.anio === ult);
  const roi = sum(cu, (r) => r.costo) ? sum(cu, (r) => r.margen) / sum(cu, (r) => r.costo) : NaN;
  const A = computeAlerts();
  const altas = A.filter((a) => a.lvl === 'alta').length;
  const low = all('insumos').filter((i) => num(i.stock_minimo) && stockInsumo(i.id) <= num(i.stock_minimo));
  const fecha = new Date().toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });

  const strip = [...activas, ...proximas];
  post(() => {
    const k = Charts.colors();
    const ingM = Array(12).fill(0); const egrM = Array(12).fill(0);
    L.forEach((l) => { const m = Number(String(l.fecha).slice(5, 7)) - 1; if (m >= 0) { ingM[m] += l.ingreso; egrM[m] += l.egreso; } });
    let acc = 0; const saldo = ingM.map((v, i) => (acc += v - egrM[i]));
    Charts.make('chFlujo', { type: 'bar', data: { labels: MESES, datasets: [
      { label: 'Ingresos', data: ingM, backgroundColor: k.primary, borderRadius: 4 },
      { label: 'Egresos', data: egrM, backgroundColor: k.maize, borderRadius: 4 },
      { label: 'Saldo acumulado', data: saldo, type: 'line', borderColor: k.soil, backgroundColor: k.soil, tension: 0.3, pointRadius: 2 },
    ] }, options: { scales: { y: Charts.moneyAxis(), x: { grid: { display: false } } }, plugins: { tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${fmtMoney(c.raw, 0)}` } } } } });
    const byC = groupBy(cerr, 'cultivo'); const labels = [...byC.keys()];
    Charts.make('chCultivo', { type: 'bar', data: { labels, datasets: [{ label: 'Margen por hectárea', data: labels.map((c) => { const g = byC.get(c); const a = sum(g, (r) => r.area); return a ? sum(g, (r) => r.margen) / a : 0; }), backgroundColor: labels.map((_, i) => k.series[i % k.series.length]), borderRadius: 4 }] },
      options: { indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => { const g = byC.get(c.label); const co = sum(g, (r) => r.costo); return `${fmtMoney(c.raw, 0)} por ha, ROI ${fmtPct(co ? sum(g, (r) => r.margen) / co : NaN)}`; } } } }, scales: { x: Charts.moneyAxis(), y: { grid: { display: false } } } } });
  });
  const c = Clima.coords(); const fc = c ? Clima.get(c.lat, c.lon) : null;
  return `<div class="page">
    ${pageHead(s.finca, `${fecha.charAt(0).toUpperCase() + fecha.slice(1)}. ${activas.length} campaña(s) en curso en ${fmtNum(ha, 1)} ha.`, `<button class="btn maize" data-act="quick">${ico('plus')} Registro rápido</button>${newBtn('campanas', 'Nueva campaña', null, '')}`)}
    <div class="panel"><h3>En el campo ahora<span class="spacer"></span><a class="small" href="#campanas">Todas las campañas</a></h3>
      ${strip.length ? `<div class="season">${strip.map(seasonRow).join('')}</div>` : `<div class="empty">No hay campañas en curso. ${newBtn('campanas', 'Registrar campaña')}</div>`}
    </div>
    <div style="margin-top:16px">${kpiBand([
      ['Área en producción', `${fmtNum(ha, 1)} ha`, `${activas.length} campaña(s) activa(s)`],
      [`Ingresos ${cy}`, fmtMoney(ing, 0), 'ventas y otros ingresos'],
      [`Egresos ${cy}`, fmtMoney(egr, 0), 'compras, jornales, combustible'],
      [`Saldo ${cy}`, fmtMoney(ing - egr, 0), 'flujo de caja del año', signCls(ing - egr)],
      [`ROI campañas ${ult || ''}`, fmtPct(roi), `${cu.length} campaña(s) cerrada(s)`, signCls(roi)],
      ['Alertas', fmtNum(A.length), `${altas} para atender ahora`, altas ? 'neg' : ''],
    ])}</div>
    <div class="grid-2">
      <div class="panel"><h3>Alertas prioritarias<span class="spacer"></span><a class="small" href="#alertas">Ver todas</a></h3>
        ${A.length ? `<div class="alert-list">${A.slice(0, 6).map(alertItem).join('')}</div>` : '<div class="empty">Sin alertas pendientes.</div>'}</div>
      <div class="panel"><h3>Ingresos y egresos ${cy}</h3><div class="chart-box"><canvas id="chFlujo" aria-label="Ingresos y egresos por mes"></canvas></div></div>
    </div>
    <div class="grid-3">
      <div class="panel"><h3>Margen por hectárea y cultivo</h3>${cerr.length ? '<div class="chart-box short"><canvas id="chCultivo" aria-label="Margen por hectárea por cultivo"></canvas></div><p class="small muted" style="margin:8px 0 0">Campañas cosechadas o cerradas. Detalle en Analítica.</p>' : '<div class="empty">Aparecerá al cerrar tu primera campaña.</div>'}</div>
      <div class="panel"><h3>Pronóstico 7 días<span class="spacer"></span><a class="small" href="#clima">Clima</a></h3>${fc ? Clima.forecastHtml(fc, true) : `<div class="empty">${c ? 'Sin pronóstico guardado. Se descargará al tener conexión.' : 'Configura la ubicación de la finca para ver el pronóstico.'}<br><button class="btn sm" data-go="${c ? 'clima' : 'config'}">${c ? 'Ir a clima' : 'Configurar'}</button></div>`}</div>
      <div class="panel"><h3>Inventario crítico<span class="spacer"></span><a class="small" href="#insumos">Inventario</a></h3>
        ${low.length ? `<div class="alert-list">${low.slice(0, 5).map((i) => { const st = stockInsumo(i.id); return `<div class="alert ${st <= 0 ? 'alta' : 'media'}"><span class="lvl"></span><div><div class="alert-title">${esc(i.nombre)}</div><div class="alert-detail">${fmtNum(st, 1)} ${esc(i.unidad || '')} de ${fmtNum(i.stock_minimo, 1)} mínimo</div></div><div class="actions"><button class="btn sm" data-act="comprar" data-id="${i.id}">Comprar</button></div></div>`; }).join('')}</div>` : '<div class="empty">Todos los insumos están sobre el mínimo.</div>'}</div>
    </div></div>`;
}

/* ---------- Detalle de campaña ---------- */
function viewCampana(id) {
  const c = byId('campanas', id);
  if (!c) return `<div class="page"><div class="panel"><div class="empty">Esta campaña ya no existe.<br><button class="btn" data-go="campanas">Ver campañas</button></div></div></div>`;
  const r = resumen(c); const k = Charts.colors();
  const preset = { campana_id: c.id };
  const socio = socioDeCampana(c);
  const otros = resumenes().filter((x) => x.cultivo === c.cultivo && x.c.id !== c.id && x.cerrada && x.costo).sort((a, b) => b.anio - a.anio);
  const prevKgHa = avg(otros.map((x) => x.kgHa).filter(Number.isFinite));
  const prevCostoHa = avg(otros.map((x) => x.costoHa).filter(Number.isFinite));
  const bit = where('bitacora', (b) => b.campana_id === c.id).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  const insG = groupBy(bit.filter((b) => b.insumo_id && b.estado !== 'Programada'), 'insumo_id');
  const jor = where('jornales', (j) => j.campana_id === c.id && j.estado !== 'Asignado');
  const tarG = groupBy(jor, 'tarea');
  const ventas = where('ventas', (v) => v.campana_id === c.id).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  const usos = groupBy(where('uso_maquinaria', (u) => u.campana_id === c.id), 'maquina_id');
  const eventos = where('clima_eventos', (e) => e.campana_id === c.id);
  const cl = c.clima;

  const comp = otros.length ? (() => {
    const msg = [];
    if (Number.isFinite(r.kgHa) && Number.isFinite(prevKgHa)) { const d = (r.kgHa - prevKgHa) / prevKgHa; msg.push(`rendimiento <span class="${d >= 0 ? 'delta-up' : 'delta-down'}">${d >= 0 ? '▲' : '▼'} ${fmtPct(Math.abs(d))}</span>`); }
    if (Number.isFinite(r.costoHa) && r.costo && Number.isFinite(prevCostoHa)) { const d = (r.costoHa - prevCostoHa) / prevCostoHa; msg.push(`costo por ha <span class="${d <= 0 ? 'delta-up' : 'delta-down'}">${d >= 0 ? '▲' : '▼'} ${fmtPct(Math.abs(d))}</span>`); }
    const rows = [{ ...r, self: true }, ...otros];
    return `${msg.length ? `<p style="margin-top:0">Frente al promedio de campañas anteriores de ${esc(c.cultivo)}: ${msg.join(', ')}.</p>` : ''}` +
      tableHtml([
        { label: 'Año', render: (x) => (x.self ? `<b>${x.anio} (esta)</b>` : x.anio) },
        { label: 'Lote', render: (x) => esc(x.lote?.nombre || '—') },
        { label: 'kg/ha', render: (x) => fmtNum(x.kgHa), n: true },
        { label: 'Costo/ha', render: (x) => fmtMoney(x.costoHa, 0), n: true },
        { label: 'ROI', render: (x) => (x.costo && (x.cerrada || x.ingresos) ? fmtPct(x.roi) : '—'), n: true },
      ], rows, { rowAttr: (x) => (x.self ? '' : `class="click" data-go="campana" data-id="${x.c.id}"`) });
  })() : `<div class="empty">Es la primera campaña cerrada de ${esc(c.cultivo)}. Las siguientes se compararán contra esta.</div>`;

  post(() => {
    const parts = [['Insumos', r.insumos], ['Mano de obra', r.manoObra], ['Maquinaria', r.maquinaria], ['Servicios y otros', r.otros]];
    if (r.costo) Charts.make('chCostos', { type: 'doughnut', data: { labels: parts.map((p) => p[0]), datasets: [{ data: parts.map((p) => p[1]), backgroundColor: [k.primary, k.maize, k.soil, k.water], borderWidth: 0 }] },
      options: { cutout: '62%', interaction: { mode: 'nearest' }, plugins: { legend: { position: 'right' }, tooltip: { callbacks: { label: (x) => `${x.label}: ${fmtMoney(x.raw, 0)} (${fmtPct(x.raw / r.costo)})` } } } } });
  });

  return `<div class="page">
    ${pageHead(campanaLabel(c), `${estadoBadge(c.estado)} Siembra ${fmtDate(c.fecha_siembra)}, cosecha ${c.fecha_cosecha_real ? fmtDate(c.fecha_cosecha_real) : 'estimada ' + fmtDate(c.fecha_cosecha_est)}. ${fmtNum(r.area, 2)} ha.`,
      `<button class="btn" data-edit="campanas:${c.id}">${ico('edit')} Editar</button>${newBtn('bitacora', 'Labor', preset, '')}${newBtn('jornales', 'Jornal', preset, '')}${newBtn('ventas', 'Venta', preset, 'primary')}`)}
    <div class="panel"><div class="season">${seasonRow(c)}</div></div>
    <div style="margin-top:16px">${kpiBand([
      ['Producción', `${fmtNum(r.prod / 1000, 1)} t`, c.calidad ? `Calidad ${esc(c.calidad)}${c.pct_primera ? `, ${fmtNum(c.pct_primera)} % de primera` : ''}` : ''],
      ['Rendimiento', `${fmtNum(r.kgHa)} kg/ha`, Number.isFinite(prevKgHa) ? `promedio previo ${fmtNum(prevKgHa)}` : ''],
      ['Costo total', fmtMoney(r.costo, 0), `${fmtNum(r.jornales, 1)} jornales`],
      ['Costo por ha', fmtMoney(r.costoHa, 0), `por kg ${fmtMoney(r.costoKg)}`],
      ['Ingresos', fmtMoney(r.ingresos, 0), Number.isFinite(r.precioProm) ? `precio prom. ${fmtMoney(r.precioProm)}/kg` : 'sin ventas aún'],
      ['Margen', fmtMoney(r.margen, 0), r.cerrada ? '' : 'parcial: campaña en curso', signCls(r.margen)],
      ['ROI', r.costo && (r.cerrada || r.ingresos) ? fmtPct(r.roi) : '—', r.cerrada ? 'margen / costo' : 'se calcula al vender la cosecha', r.cerrada || r.ingresos ? signCls(r.roi) : ''],
    ])}</div>
    ${socio ? `<div class="banner info" style="margin-top:16px">Contrato con ${esc(lab('contactos', socio.contacto_id))} (${fmtNum(socio.porcentaje)} % de la utilidad): le corresponden <b>${fmtMoney(Math.max(0, r.margen) * num(socio.porcentaje) / 100, 0)}</b>; tu parte, <b>${fmtMoney(r.margen - Math.max(0, r.margen) * num(socio.porcentaje) / 100, 0)}</b>.</div>` : ''}
    <div class="grid-2">
      <div class="panel"><h3>Distribución de costos</h3>${r.costo ? '<div class="chart-box short"><canvas id="chCostos" aria-label="Distribución de costos"></canvas></div>' : '<div class="empty">Aún no hay costos registrados en esta campaña.</div>'}</div>
      <div class="panel"><h3>Comparación con otros años</h3>${comp}</div>
    </div>
    <div class="grid-2">
      <div class="panel"><h3>Insumos aplicados</h3>${tableHtml([
        { label: 'Insumo', render: ([iid]) => `<b>${esc(lab('insumos', iid))}</b>` },
        { label: 'Cantidad', render: ([iid, g]) => `${fmtNum(sum(g, (b) => b.cantidad), 1)} ${esc(byId('insumos', iid)?.unidad || '')}`, n: true },
        { label: 'Dosis/ha', render: ([, g]) => (r.area ? fmtNum(sum(g, (b) => b.cantidad) / r.area, 1) : '—'), n: true },
        { label: 'Costo', render: ([, g]) => fmtMoney(sum(g, (b) => b.costo), 0), n: true },
      ], [...insG.entries()], { empty: 'Sin insumos aplicados.' })}</div>
      <div class="panel"><h3>Clima de la campaña<span class="spacer"></span><button class="btn sm" data-act="clima-hist" data-id="${c.id}">${ico('refresh')} ${cl ? 'Actualizar' : 'Obtener historial'}</button></h3>
        ${cl ? kpiBand([['Lluvia acumulada', `${fmtNum(cl.lluvia)} mm`], ['Temp. media', `${fmtNum(cl.tmedia, 1)} °C`], ['Mínima absoluta', `${fmtNum(cl.tmin, 1)} °C`], ['Días con helada', fmtNum(cl.dias_helada)]]) + `<p class="small muted">Del ${fmtDate(cl.desde)} al ${fmtDate(cl.hasta)}. Fuente: ${esc(cl.fuente)}.</p>` : '<p class="muted">Descarga lluvia, temperaturas y heladas del periodo de la campaña para compararlas año a año.</p>'}
        ${eventos.length ? `<div class="alert-list">${eventos.map((e) => `<div class="alert ${e.impacto === 'Alto' ? 'alta' : e.impacto === 'Medio' ? 'media' : 'baja'}"><span class="lvl"></span><div><div class="alert-title">${esc(e.tipo)} ${fmtDate(e.fecha)}</div><div class="alert-detail">${esc(e.descripcion || '')}</div></div><div class="actions"><button class="btn sm ghost" data-edit="clima_eventos:${e.id}">Ver</button></div></div>`).join('')}</div>` : ''}
        <div style="margin-top:10px">${newBtn('clima_eventos', 'Registrar evento climático', { campana_id: c.id, lote_id: c.lote_id }, 'sm')}</div>
      </div>
    </div>
    <div class="panel" style="margin-top:16px"><h3>Bitácora de campo<span class="spacer"></span>${newBtn('bitacora', 'Labor', preset, 'sm')}</h3>
      ${bit.length ? `<div class="timeline">${bit.map((b) => { const i = byId('insumos', b.insumo_id); return `<div class="tl-item click" data-edit="bitacora:${b.id}" style="cursor:pointer"><div class="tl-date">${fmtDate(b.fecha).slice(0, 5)}<br><span class="small">${yearOf(b.fecha)}</span></div><div><b>${esc(b.tipo)}</b>${i ? `: ${esc(i.nombre)} ${fmtNum(b.cantidad, 1)} ${esc(i.unidad || '')}` : ''}${b.duracion_h ? `, ${fmtNum(b.duracion_h, 1)} h` : ''}${b.volumen_m3 ? `, ${fmtNum(b.volumen_m3)} m³` : ''}<div class="small muted">${esc(b.notas || '')}</div></div><div style="text-align:right">${fmtMoney(b.costo, 0)}<br>${estadoBadge(b.estado)}</div></div>`; }).join('')}</div>` : '<div class="empty">Sin labores registradas.</div>'}
    </div>
    <div class="grid-2">
      <div class="panel"><h3>Mano de obra por tarea</h3>${tableHtml([
        { label: 'Tarea', render: ([t]) => `<b>${esc(t)}</b>` },
        { label: 'Jornales', render: ([, g]) => fmtNum(sum(g, (j) => j.dias), 1), n: true },
        { label: 'Avance', render: ([, g]) => { const a = sum(g, (j) => j.avance); return a ? `${fmtNum(a)} ${esc(g.find((j) => j.unidad_avance)?.unidad_avance || '')}` : '—'; }, n: true },
        { label: 'Costo', render: ([, g]) => fmtMoney(sum(g, (j) => j.costo), 0), n: true },
      ], [...tarG.entries()], { empty: `Sin jornales registrados. ${newBtn('jornales', 'Registrar jornal', preset, 'sm')}` })}</div>
      <div class="panel"><h3>Ventas</h3>${tableHtml([
        { label: 'Fecha', render: (v) => fmtDate(v.fecha) },
        { label: 'Cliente', render: (v) => esc(lab('contactos', v.contacto_id)) },
        { label: 'Kg', render: (v) => fmtNum(v.cantidad_kg), n: true },
        { label: 'Total', render: (v) => fmtMoney(v.total, 0), n: true },
        { label: 'Cobro', render: (v) => estadoBadge(v.estado_cobro) },
      ], ventas, { rowAttr: (v) => `class="click" data-edit="ventas:${v.id}"`, empty: 'Sin ventas registradas.' })}</div>
    </div>
    <div class="panel" style="margin-top:16px"><h3>Maquinaria usada<span class="spacer"></span>${newBtn('uso_maquinaria', 'Uso de maquinaria', preset, 'sm')}</h3>${tableHtml([
      { label: 'Equipo', render: ([m]) => `<b>${esc(lab('maquinaria', m))}</b>` },
      { label: 'Horas', render: ([, g]) => fmtNum(sum(g, (u) => u.horas), 1), n: true },
      { label: 'Combustible', render: ([, g]) => `${fmtNum(sum(g, (u) => u.combustible_l))} L`, n: true },
      { label: 'Costo', render: ([, g]) => fmtMoney(sum(g, (u) => u.costo_total), 0), n: true },
    ], [...usos.entries()], { empty: 'Sin uso de maquinaria registrado.' })}</div>
  </div>`;
}

/* ---------- Detalle de lote ---------- */
function viewLote(id) {
  const l = byId('lotes', id);
  if (!l) return `<div class="page"><div class="panel"><div class="empty">Este lote ya no existe.<br><button class="btn" data-go="lotes">Ver lotes</button></div></div></div>`;
  const rs = resumenes().filter((r) => r.c.lote_id === id).sort((a, b) => (b.anio || 0) - (a.anio || 0));
  const contratos = where('contratos', (k) => k.lote_id === id);
  const closed = rs.filter((r) => r.cerrada && Number.isFinite(r.kgHa));
  const map = Clima.valid(l.lat, l.lon) ? `<a class="btn" href="https://www.openstreetmap.org/?mlat=${l.lat}&mlon=${l.lon}#map=16/${l.lat}/${l.lon}" target="_blank" rel="noopener">${ico('pin')} Ver en mapa</a>` : '';
  post(() => {
    if (!closed.length) return;
    const k = Charts.colors(); const years = [...new Set(closed.map((r) => r.anio))].sort();
    const cults = [...new Set(closed.map((r) => r.cultivo))];
    Charts.make('chLote', { type: 'bar', data: { labels: years, datasets: cults.map((cu, i) => ({ label: cu, data: years.map((y) => { const g = closed.filter((r) => r.anio === y && r.cultivo === cu); return g.length ? sum(g, (r) => r.prod) / sum(g, (r) => r.area) : null; }), backgroundColor: k.series[i % k.series.length], borderRadius: 4 })) },
      options: { scales: { y: { title: { display: true, text: 'kg/ha' } }, x: { grid: { display: false } } }, plugins: { tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${fmtNum(c.raw)} kg/ha` } } } } });
  });
  return `<div class="page">
    ${pageHead(l.nombre, `${esc(l.ubicacion || 'Sin ubicación')}. ${fmtNum(l.hectareas, 2)} ha, suelo ${esc((l.tipo_suelo || 'sin especificar').toLowerCase())}, ${esc((l.tenencia || '').toLowerCase())}, riego ${esc((l.riego || 'sin especificar').toLowerCase())}.`,
      `<button class="btn" data-edit="lotes:${l.id}">${ico('edit')} Editar</button>${map}${newBtn('campanas', 'Nueva campaña', { lote_id: l.id })}`)}
    ${kpiBand([
      ['Área', `${fmtNum(l.hectareas, 2)} ha`],
      ['Campañas registradas', fmtNum(rs.length)],

/* ---------- Analítica y comparaciones ---------- */
function aggRes(list) {
  const area = sum(list, (r) => r.area); const prod = sum(list, (r) => r.prod); const costo = sum(list, (r) => r.costo);
  const ing = sum(list, (r) => r.ingresos); const kgv = sum(list, (r) => r.kgVendidos);
  const ll = list.filter((r) => r.c.clima && Number.isFinite(r.c.clima.lluvia));
  return {
    n: list.length, area, prod, costo, ing, margen: ing - costo,
    kgHa: area && prod ? prod / area : NaN, costoHa: area && costo ? costo / area : NaN, costoKg: prod && costo ? costo / prod : NaN,
    roi: costo ? (ing - costo) / costo : NaN,
    precio: kgv ? sum(list, (r) => num(r.precioProm) * r.kgVendidos) / kgv : NaN,
    lluvia: ll.length ? avg(ll.map((r) => r.c.clima.lluvia)) : NaN,
  };
}

/* ---------- Clima (Open-Meteo, sin clave) ---------- */
const Clima = {
  key: (lat, lon) => `${Number(lat).toFixed(2)},${Number(lon).toFixed(2)}`,
  valid: (lat, lon) => lat !== null && lat !== undefined && lat !== '' && lon !== null && lon !== undefined && lon !== '' && Number.isFinite(Number(lat)) && Number.isFinite(Number(lon)),
  coords() { const s = S(); return this.valid(s.lat, s.lon) ? { lat: Number(s.lat), lon: Number(s.lon), nombre: s.finca } : null; },
  locations() {
    const out = []; const c = this.coords(); if (c) out.push({ id: 'finca', ...c, nombre: `Finca (${c.nombre})` });
    all('lotes').filter((l) => this.valid(l.lat, l.lon)).forEach((l) => out.push({ id: l.id, lat: Number(l.lat), lon: Number(l.lon), nombre: l.nombre }));
    return out;
  },
  get(lat, lon) { return (Store.kv('clima_cache', {}) || {})[this.key(lat, lon)] || null; },
  async fetchForecast(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=7`;
    let r;
    try { r = await fetch(url); } catch (e) { throw new Error('No se pudo conectar con el servicio de clima. Se mantiene el último pronóstico guardado.'); }
    if (!r.ok) throw new Error(`El servicio de clima respondió ${r.status}.`);
    const d = (await r.json()).daily;
    const days = d.time.map((t, i) => ({ fecha: t, code: d.weather_code?.[i], tmax: d.temperature_2m_max[i], tmin: d.temperature_2m_min[i], lluvia: d.precipitation_sum[i], prob: d.precipitation_probability_max?.[i], viento: d.wind_speed_10m_max?.[i] }));
    const cache = { ...(Store.kv('clima_cache', {}) || {}) };
    cache[this.key(lat, lon)] = { at: new Date().toISOString(), days, demo: false };
    await Store.setKV('clima_cache', cache); Data.invalidate();
    return cache[this.key(lat, lon)];
  },
  async autoRefresh() {
    const c = this.coords(); if (!c || !navigator.onLine) return;
    const fc = this.get(c.lat, c.lon);
    if (fc && !fc.demo && Date.now() - tms(fc.at) < 3 * 3600e3) return;
    try { await this.fetchForecast(c.lat, c.lon); UI.softRefresh(); } catch (e) { /* se conserva lo guardado */ }
  },
  alerts() {
    const c = this.coords(); if (!c) return [];
    const fc = this.get(c.lat, c.lon); if (!fc) return [];
    const s = S(); const t = today(); const out = []; const tag = fc.demo ? ' (pronóstico de ejemplo)' : '';
    fc.days.filter((d) => d.fecha >= t).forEach((d) => {
      const dia = `${DIAS[new Date(d.fecha + 'T12:00:00').getDay()]} ${fmtDate(d.fecha).slice(0, 5)}`;
      if (Number.isFinite(d.tmin) && d.tmin <= num(s.umbral_helada)) out.push({ key: `hel:${d.fecha}`, lvl: d.tmin <= 0 ? 'alta' : 'media', tipo: 'Clima', title: `Riesgo de helada el ${dia}`, detail: `Mínima prevista ${fmtNum(d.tmin, 1)} °C${tag}. Considera riego de protección o cobertura.`, route: ['clima'] });
      if (Number.isFinite(d.lluvia) && d.lluvia >= num(s.umbral_lluvia)) out.push({ key: `llu:${d.fecha}`, lvl: 'media', tipo: 'Clima', title: `Lluvia intensa el ${dia}`, detail: `${fmtNum(d.lluvia, 1)} mm previstos${tag}. Reprograma aplicaciones foliares.`, route: ['clima'] });
      if (Number.isFinite(d.viento) && d.viento >= num(s.umbral_viento)) out.push({ key: `vie:${d.fecha}`, lvl: 'baja', tipo: 'Clima', title: `Viento fuerte el ${dia}`, detail: `Ráfagas de ${fmtNum(d.viento)} km/h${tag}. Evita fumigar.`, route: ['clima'] });
    });
    return out;
  },
  emoji(d) {
    const c = d.code;
    if (c === null || c === undefined) return d.lluvia >= 1 ? '🌧️' : '⛅';
    if (c === 0) return '☀️'; if (c <= 3) return '⛅'; if (c <= 48) return '🌫️'; if (c <= 67) return '🌧️'; if (c <= 77) return '🌨️'; if (c <= 82) return '🌦️'; return '⛈️';
  },
  forecastHtml(fc, compact = false) {
    const s = S(); const days = fc.days.filter((d) => d.fecha >= today()).slice(0, 7);
    if (!days.length) return '<div class="empty">El pronóstico guardado ya pasó. Actualízalo con conexión.</div>';
    if (compact) {
      return `<div class="wx-list">${days.map((d) => { const frost = d.tmin <= num(s.umbral_helada); const rain = d.lluvia >= num(s.umbral_lluvia);
        return `<div class="wx-row ${frost ? 'frost' : rain ? 'rain' : ''}"><span class="d">${DIAS[new Date(d.fecha + 'T12:00:00').getDay()]} ${d.fecha.slice(8)}</span><span class="e" aria-hidden="true">${this.emoji(d)}</span><span class="t">${fmtNum(d.tmax)}° / ${fmtNum(d.tmin)}°${frost ? ' <span class="badge info">Helada</span>' : rain ? ' <span class="badge warn">Lluvia</span>' : ''}</span><span class="r">${fmtNum(d.lluvia, 1)} mm</span></div>`; }).join('')}</div><p class="small muted" style="margin:8px 0 0">${fc.demo ? 'Pronóstico de ejemplo. Se reemplaza al conectarse.' : `Actualizado ${fmtAgo(fc.at)}. Fuente: Open-Meteo.`}</p>`;
    }
    const cells = days.map((d) => {
      const frost = d.tmin <= num(s.umbral_helada); const rain = d.lluvia >= num(s.umbral_lluvia);
      return `<div class="wx-day ${frost ? 'frost' : rain ? 'rain' : ''}"><div class="d">${DIAS[new Date(d.fecha + 'T12:00:00').getDay()]} ${d.fecha.slice(8)}</div><div class="e" aria-hidden="true">${this.emoji(d)}</div><div class="t">${fmtNum(d.tmax)}° / ${fmtNum(d.tmin)}°</div><div class="r">${fmtNum(d.lluvia, 1)} mm${!compact && d.prob !== undefined && d.prob !== null ? `, ${fmtNum(d.prob)} %` : ''}</div>${!compact && d.viento ? `<div class="r">${fmtNum(d.viento)} km/h</div>` : ''}</div>`;
    }).join('');
    return `<div class="wx" ${compact ? 'style="grid-template-columns:repeat(7,minmax(64px,1fr))"' : ''}>${cells}</div><p class="small muted" style="margin:8px 0 0">${fc.demo ? 'Pronóstico de ejemplo. Se reemplaza al conectarse.' : `Actualizado ${fmtAgo(fc.at)}. Fuente: Open-Meteo.`}</p>`;
  },
  async fetchHistorico(c) {
    const l = byId('lotes', c.lote_id);
    const loc = l && this.valid(l.lat, l.lon) ? { lat: Number(l.lat), lon: Number(l.lon) } : this.coords();
    if (!loc) throw new Error('Registra las coordenadas del lote o de la finca para consultar el clima.');
    if (!c.fecha_siembra) throw new Error('La campaña necesita fecha de siembra.');
    let fin = c.fecha_cosecha_real || c.fecha_cosecha_est || today();
    const lim = addDays(today(), -6); if (fin > lim) fin = lim;
    if (fin <= c.fecha_siembra) throw new Error('Aún no hay suficientes días de historial para esta campaña.');
    const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${c.fecha_siembra}&end_date=${fin}&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum&timezone=auto`;
    let r;
    try { r = await fetch(url); } catch (e) { throw new Error('No se pudo conectar con el servicio de clima histórico.'); }
    if (!r.ok) throw new Error(`El servicio de clima respondió ${r.status}.`);
    const d = (await r.json()).daily;
    const vals = (key) => (d[key] || []).filter((v) => v !== null && v !== undefined);
    const mins = vals('temperature_2m_min');
    const res = { desde: c.fecha_siembra, hasta: fin, lluvia: round1(vals('precipitation_sum').reduce((a, b) => a + b, 0)), tmedia: round1(avg(vals('temperature_2m_mean'))), tmin: mins.length ? Math.min(...mins) : null, tmax: Math.max(...vals('temperature_2m_max')), dias_helada: mins.filter((v) => v <= 0).length, fuente: 'Open-Meteo', at: new Date().toISOString() };
    await saveRec('campanas', { ...c, clima: res });
    return res;
  },
};

/* ---------- Respaldo ---------- */
function exportBackup() {
  const docs = [...Store.docs.values()].map(({ _dirty, ...d }) => d);
  downloadFile(`agrogestion-respaldo-${today()}.json`, JSON.stringify({ app: 'agrogestion', version: VERSION, exported_at: new Date().toISOString(), docs }, null, 1), 'application/json');
  toast('Respaldo exportado');
}
async function importBackup(file) {
  if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (j.app !== 'agrogestion' || !Array.isArray(j.docs)) throw new Error('El archivo no es un respaldo de AgroGestión.');
    const incoming = j.docs.filter((d) => d.id && d.col).filter((d) => { const loc = Store.docs.get(d.id); return !loc || tms(d.updated_at) > tms(loc.updated_at); });
    await Store.putDocs(incoming.map((d) => ({ ...d, _dirty: 1 })));
    afterChange(); toast(`${incoming.length} registros importados`); UI.softRefresh();
  } catch (e) { toast('No se pudo importar: ' + e.message, 'error'); }
}

/* ---------- Notificaciones del dispositivo ---------- */
const Notify = {
  supported: () => 'Notification' in window,
  on() { return !!Store.kv('notif', false) && this.supported() && Notification.permission === 'granted'; },
  async toggle() {
    if (!this.supported()) throw new Error('Este navegador no permite notificaciones.');
    if (this.on()) { await Store.setKV('notif', false); toast('Notificaciones desactivadas'); return; }
    const p = await Notification.requestPermission();
    if (p !== 'granted') throw new Error('El permiso de notificaciones fue denegado.');
    await Store.setKV('notif', true); toast('Notificaciones activadas'); this.check();
  },
  async check() {
    try {
      if (!this.on()) return;
      const t = today(); const sent = { ...(Store.kv('notif_sent', {}) || {}) };
      const nuevas = computeAlerts().filter((a) => a.lvl === 'alta' && !sent[`${a.key}@${t}`]);
      if (!nuevas.length) return;
      Object.keys(sent).forEach((k) => { if (!k.endsWith('@' + t)) delete sent[k]; });
      nuevas.forEach((a) => { sent[`${a.key}@${t}`] = 1; });
      await Store.setKV('notif_sent', sent);
      const title = nuevas.length === 1 ? nuevas[0].title : `${nuevas.length} alertas para atender`;
      const body = nuevas.slice(0, 3).map((a) => a.title).join('\n');
      const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
      if (reg) reg.showNotification(title, { body, icon: 'icon-192.png', tag: 'agro-alertas' }); else new Notification(title, { body });
    } catch (e) { console.warn(e); }
  },
};

  jornales: () => {
    const rows = filteredRows('jornales'); const done = rows.filter((j) => j.estado !== 'Asignado');
    const g = groupBy(done, 'trabajador_id');
    const asig = rows.filter((j) => j.estado === 'Asignado');
    const prod = [...g.entries()].map(([tid, l]) => {
      const dias = sum(l, (j) => j.dias); const byU = groupBy(l.filter((j) => num(j.avance)), (j) => `${j.tarea}|${j.unidad_avance || ''}`);
      return { tid, dias, costo: sum(l, (j) => j.costo), rend: [...byU.entries()].map(([k, x]) => { const [t, u] = k.split('|'); const d = sum(x, (j) => j.dias); return `${esc(t)}: ${fmtNum(sum(x, (j) => j.avance) / (d || 1))} ${esc(u)}/día`; }).join('<br>') };
    }).sort((a, b) => b.dias - a.dias);
    return `<div style="margin-bottom:14px">${kpiBand([['Jornales realizados', fmtNum(sum(done, (j) => j.dias), 1)], ['Costo de mano de obra', fmtMoney(sum(done, (j) => j.costo), 0)], ['Por pagar', fmtMoney(sum(done.filter((j) => j.pagado !== 'Sí'), (j) => j.costo), 0)], ['Tareas asignadas', fmtNum(asig.length), 'pendientes de realizar']])}</div>
      ${prod.length ? `<div class="panel" style="margin-bottom:14px"><h3>Productividad por trabajador</h3>${tableHtml([
        { label: 'Trabajador', render: (x) => `<b>${esc(lab('trabajadores', x.tid))}</b>` },
        { label: 'Días', render: (x) => fmtNum(x.dias, 1), n: true },
        { label: 'Costo', render: (x) => fmtMoney(x.costo, 0), n: true },
        { label: 'Rendimiento por tarea', render: (x) => x.rend || '<span class="muted">Sin avance registrado</span>' },
      ], prod)}</div>` : ''}`;
  },
  maquinaria: () => {
    const cy = new Date().getFullYear(); const u = where('uso_maquinaria', (x) => yearOf(x.fecha) === cy);
    const prox = all('maquinaria').filter((m) => { const i = maquinaInfo(m.id); return i.intervalo && i.pct >= 0.9; }).length;
    return `<div style="margin-bottom:14px">${kpiBand([[`Horas ${cy}`, fmtNum(sum(u, (x) => x.horas), 1)], [`Combustible ${cy}`, `${fmtNum(sum(u, (x) => x.combustible_l))} L`, fmtMoney(sum(u, (x) => x.costo_combustible), 0)], [`Mantenimiento ${cy}`, fmtMoney(sum(where('mantenimientos', (x) => yearOf(x.fecha) === cy), (x) => x.costo), 0)], ['Mantenimiento próximo', fmtNum(prox), 'equipos', prox ? 'neg' : '']])}</div>`;
  },
};

  const CAMPS = [

    R.jor.forEach(([tarea, off, perHa]) => {

    });
    // Maquinaria
    R.maq.forEach(([labor, off, hHa]) => {
      if (!(closed || off <= elapsed)) return;
      const h = round1(hHa * area); const l = round1(h * 7);
      usos.push({ fecha: addDays(cd.siembra, off), maquina_id: TR, campana_id: cid, labor, horas: h, combustible_l: l, costo_combustible: r2(l * 4.6 * fx), operador_id: OPER, costo_total: r2(l * 4.6 * fx + h * 45) });
    });
    if (closed) { const h = round1(1.5 * area); usos.push({ fecha: addDays(fin, 2), maquina_id: CA, campana_id: cid, labor: 'Transporte', horas: h, combustible_l: round1(h * 3), costo_combustible: r2(h * 3 * 4.6 * fx), operador_id: OPER, costo_total: r2(h * 3 * 4.6 * fx + h * 20) }); }

    // Ventas y fletes
    if (closed) {
      const vend = Math.round(prod * 0.97);
      [[0.5, 1, 3], [0.3, 0.96, 10], [0.2, 1.05, 25]].forEach(([p, pf, d], ix) => {
        const kg = Math.round(vend * p); const precio = r2(cd.precio * pf);
        add('ventas', { fecha: addDays(fin, d), campana_id: cid, contacto_id: cd.rec === 'quinua' ? C2 : C1, calidad: cd.calidad, cantidad_kg: kg, precio_kg: precio, total: r2(kg * precio), estado_cobro: cd.pendiente && ix === 2 ? 'Pendiente' : 'Cobrado', comprobante: `F001-${nFac++}` });
      });
      add('movimientos', { fecha: addDays(fin, 3), tipo: 'Egreso', categoria: 'Transporte / flete', monto: r2(vend * 0.035), campana_id: cid, medio: 'Efectivo', descripcion: 'Flete de cosecha al punto de venta' });
    }
    if (cd.arriendo) add('movimientos', { fecha: addDays(cd.siembra, -20), tipo: 'Egreso', categoria: 'Arrendamiento', monto: 2500 * area, campana_id: cid, medio: 'Transferencia', descripcion: 'Arriendo lote Santa Rosa (T. Quispe)' });
    if (cd.ev) add('clima_eventos', { ...cd.ev, lote_id: L.id, campana_id: cid });
  }

  // Labores programadas y tareas asignadas (para ver alertas)
  add('bitacora', { fecha: addDays(t, -1), campana_id: ids.chica, tipo: 'Riego', estado: 'Programada', duracion_h: 6, costo: 0, notas: 'Último riego antes de la cosecha' });
  add('bitacora', { fecha: addDays(t, 2), campana_id: ids.actual, tipo: 'Fitosanitario', estado: 'Programada', insumo_id: I.fung.id, cantidad: 8.8, costo: null, notas: 'Preventivo contra rancha por lluvias' });
  [W[1], W[2], W[3]].forEach((w) => add('jornales', { fecha: addDays(t, 10), trabajador_id: w.id, campana_id: ids.chica, tarea: 'Cosecha', estado: 'Asignado', dias: 5, costo: null, pagado: 'No' }));
  [W[1], W[3]].forEach((w) => add('jornales', { fecha: t, trabajador_id: w.id, campana_id: ids.actual, tarea: 'Deshierbo', estado: 'Asignado', dias: 1, costo: null, pagado: 'No' }));

  // Uso general del tractor (sin campaña) y mantenimientos
  [[-120, 'Nivelación de terreno', 18], [-80, 'Servicio a terceros', 18], [-45, 'Transporte de guano de corral', 12]].forEach(([d, labor, h]) => {
    const l = round1(h * 7); usos.push({ fecha: addDays(t, d), maquina_id: TR, campana_id: '', labor, horas: h, combustible_l: l, costo_combustible: r2(l * 4.6), operador_id: OPER, costo_total: r2(l * 4.6 + h * 45) });
  });
  usos.forEach((u) => add('uso_maquinaria', u));
  const H = (maq, ini, fecha) => ini + usos.filter((u) => u.maquina_id === maq && u.fecha < fecha).reduce((a, u) => a + u.horas, 0);
  add('mantenimientos', { fecha: addDays(t, -540), maquina_id: TR, tipo: 'Preventivo', horometro: round1(H(TR, 3120, addDays(t, -540))), descripcion: 'Cambio de aceite y filtros', costo: 480 });
  add('mantenimientos', { fecha: addDays(t, -300), maquina_id: TR, tipo: 'Correctivo', horometro: round1(H(TR, 3120, addDays(t, -300))), descripcion: 'Reparación de bomba hidráulica', costo: 1350 });
  add('mantenimientos', { fecha: addDays(t, -170), maquina_id: TR, tipo: 'Preventivo', horometro: round1(H(TR, 3120, addDays(t, -170))), descripcion: 'Cambio de aceite, filtros y engrase general', costo: 520 });
  add('mantenimientos', { fecha: addDays(t, -175), maquina_id: CA, tipo: 'Preventivo', horometro: round1(H(CA, 0, addDays(t, -175))), descripcion: 'Mantenimiento de 10 000 km', costo: 650, proxima_fecha: addDays(t, 5) });
  add('mantenimientos', { fecha: addDays(t, -400), maquina_id: MB, tipo: 'Preventivo', horometro: round1(H(MB, 410, addDays(t, -400))), descripcion: 'Cambio de aceite y bujía', costo: 90 });

  // Insumos con stock inicial calculado
  Object.values(I).forEach((i) => {
    const sobrante = i.compra - i.uso;
    add('insumos', { id: i.id, nombre: i.nombre, categoria: i.categoria, unidad: i.unidad, stock_inicial: Math.max(0, round1(i.fin - sobrante)), stock_minimo: i.stock_minimo, costo_unitario: i.costo_unitario, proveedor_id: i.prov, vencimiento: i.venc || '', notas: '' });
  });

  // Contratos
  add('contratos', { tipo: 'Arrendamiento de tierra', codigo: 'ARR-01', contacto_id: A1, lote_id: lotes.L3.id, fecha_inicio: `${Y - 2}-09-01`, fecha_fin: addDays(t, 25), monto: 5000, periodicidad: 'Por campaña', alerta_dias: 30, condiciones: 'S/ 2 500 por hectárea por campaña, pago adelantado. Renovación con 30 días de aviso.' });
  add('contratos', { tipo: 'Socio / asociación', codigo: 'SOC-01', contacto_id: S1, fecha_inicio: `${Y - 3}-08-01`, fecha_fin: `${Y + 1}-07-31`, porcentaje: 50, periodicidad: 'Por campaña', alerta_dias: 60, condiciones: 'Reparto 50/50 de la utilidad de cada campaña. El socio aporta capital de trabajo; la finca aporta tierra, maquinaria y gestión.' });
  add('contratos', { tipo: 'Cliente', codigo: 'VEN-07', contacto_id: C1, fecha_inicio: `${Y}-01-15`, fecha_fin: addDays(t, 70), periodicidad: 'Único', alerta_dias: 30, condiciones: 'Compromiso de compra de papa a precio de mercado, entrega en chacra.' });
  add('contratos', { tipo: 'Proveedor', codigo: 'CRE-02', contacto_id: P1, fecha_inicio: `${Y - 1}-10-01`, fecha_fin: addDays(t, -6), monto: 15000, periodicidad: 'Único', alerta_dias: 30, condiciones: 'Línea de crédito de insumos a 60 días.' });

  // Otros movimientos
  [Y - 2, Y - 1, Y].forEach((y) => add('movimientos', { fecha: `${y}-03-15`, tipo: 'Egreso', categoria: 'Agua de riego', monto: 380, campana_id: '', medio: 'Efectivo', descripcion: 'Tarifa anual de la junta de usuarios' }));
  add('movimientos', { fecha: `${Y - 1}-10-05`, tipo: 'Ingreso', categoria: 'Aporte de socio', monto: 12000, campana_id: '', medio: 'Transferencia', descripcion: 'Aporte de capital de trabajo para la campaña' });

  await Store.putDocs(out);
  // Pronóstico de ejemplo (se reemplaza con datos reales al tener conexión)
  const c = Clima.coords();
  if (c) {
    const cache = { ...(Store.kv('clima_cache', {}) || {}) }; const k = Clima.key(c.lat, c.lon);
    if (!cache[k] || cache[k].demo) {
      const tmin = [4.2, 3.1, 1.4, -0.6, 2.2, 5.1, 6]; const lluvia = [0, 2.4, 0, 0, 24.5, 8.2, 1.1]; const code = [1, 61, 0, 0, 63, 80, 2];
      cache[k] = { at: new Date().toISOString(), demo: true, days: tmin.map((m, i) => ({ fecha: addDays(t, i), tmin: m, tmax: [20, 18, 21, 22, 16, 17, 19][i], lluvia: lluvia[i], prob: [5, 40, 0, 0, 85, 60, 20][i], viento: [18, 22, 15, 12, 30, 26, 20][i], code: code[i] })) };
      await Store.setKV('clima_cache', cache);
    }
  }
  Data.invalidate(); afterChange();
}

/* ---------- Arranque ---------- */
async function boot() {
  await Store.init();
  UI.applyTheme();
  window.addEventListener('hashchange', () => { if (Auth.session) render(); });
  window.addEventListener('online', () => { UI.updateSync(); Sync.run(); Clima.autoRefresh(); });
  window.addEventListener('offline', () => UI.updateSync());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Sync.enabled()) Sync.run(); });
  setInterval(() => { if (Sync.enabled()) Sync.run(); }, 60000);
  setInterval(() => { Data.invalidate(); if (Auth.session && ['dashboard', 'alertas'].includes(UI.current.route)) UI.softRefresh(); Notify.check(); }, 30 * 60000);
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); UI.installEvt = e; const b = $('#installBtn'); if (b) b.hidden = false; });
  let top = true; try { top = window.self === window.top; } catch (e) { top = false; }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && top) navigator.serviceWorker.register('sw.js').catch(() => {});
  const sess = Store.kv('session');
  if (sess && (sess.mode === 'remote') === !!Auth.remoteCfg()) {
    Auth.session = sess; UI.showApp();
    if (Sync.enabled()) Sync.run();
  } else UI.showLogin();
}
boot();

</script>
