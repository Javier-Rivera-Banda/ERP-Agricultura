<meta name="description" content="Sistema de gestión agraria por lote, cultivo y campaña. Funciona sin conexión.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AgroGestión">
<title>AgroGestión</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #f3f6f1;
  --surface: #ffffff;
  --surface-2: #eaf0e7;
  --line: #d3ddcf;
  --text: #19281f;
  --muted: #5a6a5f;
  --primary: #1e6b3a;
  --primary-ink: #ffffff;
  --primary-soft: #dcecdf;
  --maize: #e3a21a;
  --maize-soft: #fbefd2;
  --soil: #7a5a3a;
  --water: #2f7fa3;
  --water-soft: #dcecf4;
  --danger: #c62f2f;
  --danger-soft: #fbe1df;
  --warn: #a86b00;
  --warn-soft: #fbefd2;
  --ok: #1e7a42;
  --ok-soft: #dcefe2;
  --side: #123d24;
  --side-2: #1a4d30;
  --side-text: #e5efe6;
  --side-muted: #a6c1ad;
  --shadow: 0 10px 30px rgba(18, 61, 36, .16);
  --font: "Barlow", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-cond: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", "Barlow", sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1511;
    --surface: #152019;
    --surface-2: #1b2a21;
    --line: #2a3b30;
    --text: #e6eee7;
    --muted: #9db0a2;
    --primary: #4fb877;
    --primary-ink: #08130c;
    --primary-soft: #1d3a27;
    --maize: #f0b73a;
    --maize-soft: #3a2f14;
    --soil: #c39a6b;
    --water: #5fb0d6;
    --water-soft: #16303d;
    --danger: #f06a5f;
    --danger-soft: #3d1c19;
    --warn: #f0b73a;
    --warn-soft: #3a2f14;
    --ok: #59c784;
    --ok-soft: #173a24;
    --side: #0a1a10;
    --side-2: #12291a;
    --side-text: #dce9de;
    --side-muted: #8eab96;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1511;
  --surface: #152019;
  --surface-2: #1b2a21;
  --line: #2a3b30;
  --text: #e6eee7;
  --muted: #9db0a2;
  --primary: #4fb877;
  --primary-ink: #08130c;
  --primary-soft: #1d3a27;
  --maize: #f0b73a;
  --maize-soft: #3a2f14;
  --soil: #c39a6b;
  --water: #5fb0d6;
  --water-soft: #16303d;
  --danger: #f06a5f;
  --danger-soft: #3d1c19;
  --warn: #f0b73a;
  --warn-soft: #3a2f14;
  --ok: #59c784;
  --ok-soft: #173a24;
  --side: #0a1a10;
  --side-2: #12291a;
  --side-text: #dce9de;
  --side-muted: #8eab96;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
:focus-visible { outline: 3px solid var(--maize); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.num, .kpi-value, td.n { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Login ---------- */
#login { height: 100%; display: grid; grid-template-columns: minmax(320px, 520px) 1fr; }
.login-side {
  background: var(--side); color: var(--side-text); padding: 48px 44px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 32px; overflow: auto;
}
.brand { display: flex; align-items: center; gap: 12px; font-family: var(--font-cond); font-weight: 700; font-size: 1.5rem; letter-spacing: .01em; }
.brand-mark { width: 40px; height: 40px; border-radius: 10px; background: var(--maize); display: grid; place-items: center; color: #123d24; }
.brand-mark .icon { width: 24px; height: 24px; stroke-width: 2.4; }
.login-title { font-family: var(--font-cond); font-weight: 700; font-size: clamp(2.2rem, 4vw, 3.1rem); line-height: 1.02; margin: 0 0 16px; max-width: 14ch; }
.login-side p { color: var(--side-muted); max-width: 42ch; margin: 0; }
.login-rows { display: grid; gap: 6px; }
.login-row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 10px; font-size: .9rem; color: var(--side-muted); }
.login-row .bar { height: 10px; border-radius: 5px; background: var(--side-2); position: relative; overflow: hidden; }
.login-row .bar span { position: absolute; inset: 0 auto 0 0; background: var(--maize); border-radius: 5px; }
.login-main { display: grid; place-items: center; padding: 32px 20px; overflow: auto; }
.login-card { width: 100%; max-width: 380px; }
.login-card h2 { font-family: var(--font-cond); font-size: 1.9rem; margin: 0 0 4px; }
.login-card form { display: grid; gap: 14px; margin-top: 24px; }
.login-hint { margin-top: 18px; padding: 12px 14px; border-left: 4px solid var(--maize); background: var(--maize-soft); border-radius: 0 8px 8px 0; font-size: .9rem; }
details.server { margin-top: 18px; font-size: .92rem; }
details.server summary { cursor: pointer; color: var(--muted); }
details.server .grid-form { margin-top: 12px; }
@media (max-width: 820px) {
  #login { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .login-side { padding: 28px 22px; }
  .login-side .login-rows, .login-side p { display: none; }
  .login-title { font-size: 2rem; margin: 0; }
}

/* ---------- App shell ---------- */
#app { height: 100%; display: grid; grid-template-columns: 256px minmax(0, 1fr); }
#sidebar {
  background: var(--side); color: var(--side-text); overflow-y: auto; padding: 22px 14px 28px;
  display: flex; flex-direction: column; gap: 18px;
}
#sidebar .brand { padding: 0 8px; font-size: 1.35rem; }
#sidebar .brand-mark { width: 34px; height: 34px; }
.farm-name { padding: 0 8px; color: var(--side-muted); font-size: .9rem; margin-top: -10px; }
.nav-group h4 { margin: 0 0 6px; padding: 0 10px; font-size: .8rem; font-weight: 600; color: var(--side-muted); }
.nav-group a {
  display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px;
  color: var(--side-text); text-decoration: none; font-weight: 500;
}
.nav-group a:hover { background: var(--side-2); }
.nav-group a.active { background: var(--maize); color: #123d24; font-weight: 700; }
.nav-group a .badge { margin-left: auto; }
.side-foot { margin-top: auto; padding: 0 8px; font-size: .8rem; color: var(--side-muted); }

#main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
#topbar {
  display: flex; align-items: center; gap: 12px; padding: 12px 28px; background: var(--surface);
  border-bottom: 1px solid var(--line); min-height: 64px;
}
#topbar h1 { font-family: var(--font-cond); font-size: 1.5rem; margin: 0; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#menuBtn { display: none; }
.sync-pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: .85rem; cursor: pointer; white-space: nowrap;
}
.sync-pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.sync-pill[data-s="ok"] .dot { background: var(--ok); }
.sync-pill[data-s="pending"] .dot, .sync-pill[data-s="offline"] .dot { background: var(--maize); }
.sync-pill[data-s="error"] .dot { background: var(--danger); }
.sync-pill[data-s="busy"] .dot { background: var(--water); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.user-chip { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }

#view { overflow-y: auto; padding: 26px 28px 60px; }
.page { max-width: 1320px; }
#bottomnav { display: none; }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  #main { grid-row: 1; }
  #sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 320px); z-index: 40;
    transform: translateX(-102%); transition: transform .22s ease;
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  #app.drawer-open #sidebar { transform: none; box-shadow: var(--shadow); }
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 39; }
  #menuBtn { display: inline-flex; }
  #topbar { padding: 8px 12px; min-height: 56px; }
  #topbar h1 { font-size: 1.3rem; }
  .user-chip .uname { display: none; }
  #view { padding: 16px 14px 40px; }
  #bottomnav {
    grid-row: 2; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface);
    border-top: 1px solid var(--line); padding: 4px 4px 6px;
  }
  #bottomnav button {
    border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: .72rem; color: var(--muted); padding: 6px 0; min-height: 52px; position: relative;
  }
  #bottomnav button.active { color: var(--primary); font-weight: 700; }
  #bottomnav .fab {
    width: 54px; height: 54px; border-radius: 50%; background: var(--maize); color: #123d24;
    display: grid; place-items: center; margin-top: -22px; box-shadow: var(--shadow);
  }
  #bottomnav .fab .icon { width: 26px; height: 26px; stroke-width: 2.6; }
  #bottomnav .badge { position: absolute; top: 2px; left: calc(50% + 4px); }
}

/* ---------- Common blocks ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin-bottom: 18px; }
.page-head .t { flex: 1 1 320px; }
.page-head h2 { font-family: var(--font-cond); font-size: 1.7rem; margin: 0; line-height: 1.1; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600;
  text-decoration: none; color: var(--text); white-space: nowrap;
}
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.maize { background: var(--maize); border-color: var(--maize); color: #123d24; }
.btn.danger { color: var(--danger); border-color: var(--danger-soft); }
.btn.danger.confirm { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.ghost { background: none; border-color: transparent; }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: .88rem; border-radius: 8px; }
.btn.icon-only { width: 44px; padding: 0; }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.panel h3 { font-family: var(--font-cond); font-size: 1.2rem; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.panel h3 .spacer { flex: 1; }
.panel + .panel { margin-top: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.grid-2 > .panel + .panel, .grid-3 > .panel + .panel { margin-top: 0; }
.span-2 { grid-column: span 2; }
@media (max-width: 1100px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .span-2 { grid-column: auto; } }

/* KPI band: one surface, divided cells */
.kpi-band {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.kpi { padding: 14px 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.kpi-label { font-size: .88rem; color: var(--muted); }
.kpi-value { font-family: var(--font-cond); font-weight: 700; font-size: 1.75rem; line-height: 1.15; }
.kpi-sub { font-size: .82rem; color: var(--muted); }
.kpi-value.pos { color: var(--ok); }
.kpi-value.neg { color: var(--danger); }

.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .8rem; font-weight: 600;
  background: var(--surface-2); color: var(--muted); white-space: nowrap;
}
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.info { background: var(--water-soft); color: var(--water); }
.badge.count { background: var(--danger); color: #fff; min-width: 20px; justify-content: center; padding: 1px 6px; }

/* Season strip: the signature element */
.season { display: grid; gap: 14px; }
.season-row { display: grid; grid-template-columns: minmax(150px, 220px) 1fr minmax(90px, auto); gap: 14px; align-items: center; cursor: pointer; }
.season-row:hover .season-name { color: var(--primary); }
.season-name { font-weight: 700; line-height: 1.2; }
.season-name small { display: block; font-weight: 500; color: var(--muted); }
.season-track { position: relative; height: 30px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.season-grow {
  position: absolute; inset: 0 auto 0 0; border-radius: 6px 0 0 6px;
  background: repeating-linear-gradient(90deg, var(--primary) 0 10px, color-mix(in srgb, var(--primary) 82%, var(--bg)) 10px 12px);
}
.season-today { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--maize); border-radius: 2px; }
.season-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: .78rem; font-weight: 600; color: var(--text); pointer-events: none; }
.season-label span:first-child { color: var(--primary-ink); text-shadow: 0 0 2px rgba(0,0,0,.25); }
.season-meta { text-align: right; font-family: var(--font-cond); font-weight: 700; font-size: 1.05rem; }
.season-meta small { display: block; font-family: var(--font); font-weight: 500; font-size: .8rem; color: var(--muted); }
@media (max-width: 640px) {
  .season-row { grid-template-columns: 1fr auto; }
  .season-track { grid-column: 1 / -1; grid-row: 2; }
}

/* Alerts */
.alert-list { display: grid; gap: 2px; }
.alert {
  display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px 10px 0;
  border-bottom: 1px solid var(--line);
}
.alert:last-child { border-bottom: 0; }
.alert .lvl { align-self: stretch; border-radius: 3px; background: var(--muted); }
.alert.alta .lvl { background: var(--danger); }
.alert.media .lvl { background: var(--maize); }
.alert.baja .lvl { background: var(--water); }
.alert-title { font-weight: 600; }
.alert-detail { font-size: .88rem; color: var(--muted); }
.alert .actions { gap: 6px; }

/* Tables -> cards on mobile */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.data { width: 100%; border-collapse: collapse; font-size: .94rem; }
table.data th {
  text-align: left; font-weight: 600; color: var(--muted); font-size: .84rem; padding: 10px 12px;
  border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap;
}
table.data td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr.click { cursor: pointer; }
table.data tbody tr.click:hover td { background: var(--surface-2); }
table.data td.n, table.data th.n { text-align: right; white-space: nowrap; }
table.data tfoot td { font-weight: 700; background: var(--surface-2); }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.empty .btn { margin-top: 12px; }
@media (max-width: 760px) {
  .table-wrap.cards { border: 0; background: none; overflow: visible; }
  .cards table.data thead { display: none; }
  .cards table.data, .cards table.data tbody, .cards table.data tr, .cards table.data td { display: block; width: 100%; }
  .cards table.data tr { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; padding: 6px 4px; }
  .cards table.data td { border: 0; padding: 5px 12px; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
  .cards table.data td::before { content: attr(data-label); color: var(--muted); font-size: .85rem; text-align: left; }
  .cards table.data td:first-child { font-weight: 700; font-size: 1.02rem; }
  .cards table.data td:first-child::before { content: none; }
  .cards table.data td:first-child { justify-content: flex-start; text-align: left; }
  .cards table.data tfoot tr { background: var(--surface-2); }
}

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
.filters .search { flex: 1 1 220px; position: relative; }
.filters .search .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
.filters .search input { padding-left: 38px; }
.filters select, .filters input { min-width: 0; }
.filters > select { flex: 0 1 220px; }

/* Forms */
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: .88rem; font-weight: 600; color: var(--muted); }
.field label .req { color: var(--danger); }
.field .help { font-size: .8rem; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], input[type=search], input[type=url], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); font-size: 16px;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.grid-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.grid-form .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .grid-form { grid-template-columns: 1fr; } }
.calc-hint { grid-column: 1 / -1; padding: 10px 12px; border-radius: 8px; background: var(--primary-soft); font-size: .9rem; }
.calc-hint:empty { display: none; }
.form-error { color: var(--danger); font-weight: 600; min-height: 1.2em; }

/* Modal / bottom sheet */
.modal-back { position: fixed; inset: 0; background: rgba(8, 20, 12, .5); z-index: 60; display: grid; place-items: center; padding: 20px; }
.modal {
  background: var(--surface); border-radius: 14px; width: min(720px, 100%); max-height: calc(100% - 20px); display: flex; flex-direction: column;
  box-shadow: var(--shadow); border: 1px solid var(--line);
}
.modal.wide { width: min(980px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; font-family: var(--font-cond); font-size: 1.35rem; flex: 1; }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-foot { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.modal-foot .spacer { flex: 1; }
@media (max-width: 760px) {
  .modal-back { place-items: end stretch; padding: 0; }
  .modal, .modal.wide { width: 100%; border-radius: 16px 16px 0 0; max-height: calc(100% - env(safe-area-inset-top, 0px) - 12px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .modal-foot .btn { flex: 1; }
  .modal-foot .spacer { display: none; }
}

/* Quick entry tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile {
  display: grid; gap: 6px; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2);
  text-align: left; cursor: pointer; min-height: 92px;
}
.tile .icon { width: 26px; height: 26px; color: var(--primary); }
.tile b { font-size: 1.02rem; }
.tile span { font-size: .82rem; color: var(--muted); }

/* Weather */
.wx { display: grid; grid-template-columns: repeat(7, minmax(84px, 1fr)); gap: 8px; overflow-x: auto; }
.wx-day { border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; background: var(--surface); }
.wx-day.frost { border-color: var(--water); background: var(--water-soft); }
.wx-day.rain { border-color: var(--maize); background: var(--maize-soft); }
.wx-day .d { font-weight: 700; font-size: .9rem; }
.wx-day .e { font-size: 1.6rem; line-height: 1.4; }
.wx-day .t { font-family: var(--font-cond); font-weight: 700; }
.wx-day .r { font-size: .8rem; color: var(--muted); }

/* Bars inside tables */
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; min-width: 80px; }
.meter span { display: block; height: 100%; background: var(--primary); border-radius: 4px; }
.meter.warn span { background: var(--maize); }
.meter.danger span { background: var(--danger); }

.chart-box { position: relative; height: 280px; }
.chart-box.tall { height: 340px; }
.chart-box.short { height: 220px; }

.timeline { display: grid; gap: 0; }
.tl-item { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.tl-item:last-child { border-bottom: 0; }
.tl-date { font-family: var(--font-cond); font-weight: 700; color: var(--muted); }
.delta-up { color: var(--ok); font-weight: 700; }
.delta-down { color: var(--danger); font-weight: 700; }

/* Toasts & banners */
#toasts { position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; display: grid; justify-items: center; gap: 8px; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 24px); pointer-events: none; }
.toast { background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 10px; font-weight: 600; box-shadow: var(--shadow); max-width: 520px; }
.toast.error { background: var(--danger); color: #fff; }
@media (max-width: 900px) { #toasts { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); } }
.banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: .92rem; }
.banner.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); color: var(--text); border-left: 4px solid var(--maize); }
.banner.info { background: var(--water-soft); border-left: 4px solid var(--water); }
.split { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.split .grow { flex: 1; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
code.k { background: var(--surface-2); padding: 1px 6px; border-radius: 4px; font-size: .88em; }

.kpi-value small { font-size: .6em; font-weight: 600; color: var(--muted); margin-left: 3px; }
.wx-list { display: grid; gap: 2px; }
.wx-row { display: grid; grid-template-columns: 68px 30px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; }
.wx-row.frost { background: var(--water-soft); }
.wx-row.rain { background: var(--maize-soft); }
.wx-row .d { font-weight: 700; font-size: .9rem; }
.wx-row .e { font-size: 1.2rem; text-align: center; }
.wx-row .t { font-family: var(--font-cond); font-weight: 700; }
.wx-row .r { font-size: .82rem; color: var(--muted); text-align: right; }

<script>
'use strict';
/* =====================================================================
   AgroGestión — Sistema de gestión agraria (offline-first, PWA)
   Núcleo: utilidades, almacenamiento local, datos, sesión y sincronización

const VERSION = '1.0.0';
const CONFIG_ID = '00000000-0000-4000-8000-000000000001'; // registro de configuración de la finca (se sincroniza)

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
}
function isoDate(d = new Date()) {
  const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return z.toISOString().slice(0, 10);
}
const today = () => isoDate();
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDate(d); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }
const num = (v) => { const n = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(n) ? n : 0; };
const sum = (arr, f) => arr.reduce((s, x) => s + num(f(x)), 0);
const tms = (s) => (s ? Date.parse(String(s).replace(/(\.\d{3})\d+/, '$1')) : 0);
function groupBy(arr, key) {
  const m = new Map();
  for (const x of arr) { const k = typeof key === 'function' ? key(x) : x[key]; if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return m;
}
function fmtNum(n, d = 0) {

  return Number(n).toLocaleString('es-PE', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtMoney(n, d = 2) { if (!Number.isFinite(Number(n))) return '—'; return `${S().moneda || 'S/'} ${fmtNum(n, d)}`; }
function fmtDate(iso) { if (!iso) return '—'; const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d}/${m}/${y}`; }
function fmtPct(n, d = 1) { return Number.isFinite(n) ? `${fmtNum(n * 100, d)} %` : '—'; }
function fmtAgo(iso) {
  if (!iso) return 'nunca';
  const s = Math.round((Date.now() - tms(iso)) / 1000);
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;

const yearOf = (iso) => (iso ? Number(String(iso).slice(0, 4)) : null);
const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Set', 'Oct', 'Nov', 'Dic'];

/* ---------- Íconos (SVG en línea, sin dependencias) ---------- */
const ICONS = {

  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',

  sprout: '<path d="M12 22V11"/><path d="M12 11C12 7 9 4 4 4c0 4 3 7 8 7z"/><path d="M12 13c0-3 2.5-6 7-6 0 3.5-2.5 6-7 6z"/>',
  book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
  trend: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
  wallet: '<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
  box: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
  tractor: '<circle cx="7" cy="17" r="4"/><circle cx="18.5" cy="18.5" r="2.5"/><path d="M3 13V6h6l2.2 7H17l2.5 3.2"/><path d="M14 13V8h3"/><path d="M7 17h.01"/>',

  chart: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  cloud: '<line x1="16" y1="13" x2="16" y2="21"/><line x1="8" y1="13" x2="8" y2="21"/><line x1="12" y1="15" x2="12" y2="23"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>',
  sliders: '<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',

  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',

  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',

  check: '<polyline points="20 6 9 17 4 12"/>',
  pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
};
const ico = (name, cls = '') => `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;

/* ---------- Almacenamiento local (IndexedDB con respaldo en localStorage) ---------- */
const Store = {
  idb: null,
  docs: new Map(), // id -> { id, col, data, updated_at, deleted, _dirty }
  kvCache: {},
  async init() {
    try {
      if (!window.indexedDB) throw new Error('sin IndexedDB');
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open('agrogestion', 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains('docs')) db.createObjectStore('docs', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'k' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      const [docs, kvs] = await Promise.all([this._all('docs'), this._all('kv')]);
      docs.forEach((d) => this.docs.set(d.id, d));
      kvs.forEach((x) => { this.kvCache[x.k] = x.v; });
    } catch (e) {
      console.warn('IndexedDB no disponible; se usa localStorage', e);
      this.idb = null;
      this._lsLoad();
    }
  },
  _all(store) {
    return new Promise((res, rej) => {
      const q = this.idb.transaction(store).objectStore(store).getAll();
      q.onsuccess = () => res(q.result || []);
      q.onerror = () => rej(q.error);
    });
  },
  _tx(store, fn) {
    return new Promise((res, rej) => {
      const tx = this.idb.transaction(store, 'readwrite');
      fn(tx.objectStore(store));
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  async putDocs(list) {
    list.forEach((d) => this.docs.set(d.id, d));
    Data.invalidate();
    if (this.idb) {
      try { await this._tx('docs', (s) => list.forEach((d) => s.put(d))); }
      catch (e) { toast('No se pudo guardar en el dispositivo: ' + e.message, 'error'); }
    } else this._lsSave();
  },
  kv(k, def = null) { return k in this.kvCache ? this.kvCache[k] : def; },
  async setKV(k, v) {
    this.kvCache[k] = v;
    if (this.idb) { try { await this._tx('kv', (s) => s.put({ k, v })); } catch (e) { console.warn(e); } }
    else this._lsSave();
  },
  async clearAll(keepKeys = []) {
    const keep = {}; keepKeys.forEach((k) => { if (k in this.kvCache) keep[k] = this.kvCache[k]; });
    this.docs.clear(); this.kvCache = keep; Data.invalidate();
    if (this.idb) {
      await this._tx('docs', (s) => s.clear());
      await this._tx('kv', (s) => { s.clear(); Object.entries(keep).forEach(([k, v]) => s.put({ k, v })); });
    } else this._lsSave();
  },
  _lsLoad() {
    try {
      const raw = JSON.parse(localStorage.getItem('agro_fallback') || '{}');
      (raw.docs || []).forEach((d) => this.docs.set(d.id, d));
      this.kvCache = raw.kv || {};
    } catch (e) { /* solo memoria */ }
  },
  _lsSave() {
    try { localStorage.setItem('agro_fallback', JSON.stringify({ docs: [...this.docs.values()], kv: this.kvCache })); }
    catch (e) { /* solo memoria */ }
  },
};

/* ---------- Capa de datos ---------- */
const Data = {
  ver: 0, _idx: null, _memo: new Map(),
  invalidate() { this.ver++; this._idx = null; this._memo.clear(); },
  index() {
    if (!this._idx) {
      const idx = {};
      for (const d of Store.docs.values()) {
        if (d.deleted) continue;
        (idx[d.col] || (idx[d.col] = [])).push({ id: d.id, ...d.data });
      }
      this._idx = idx;
    }
    return this._idx;
  },
  memo(key, fn) { if (!this._memo.has(key)) this._memo.set(key, fn()); return this._memo.get(key); },
};
const all = (col) => Data.index()[col] || [];
const where = (col, pred) => all(col).filter(pred);
function byId(col, id) {
  if (!id) return null;
  const d = Store.docs.get(id);
  return d && !d.deleted && d.col === col ? { id: d.id, ...d.data } : null;
}
async function saveRec(col, rec) {
  const id = rec.id || uuid();
  const data = { ...rec }; delete data.id;
  await Store.putDocs([{ id, col, data, updated_at: new Date().toISOString(), deleted: false, _dirty: 1 }]);
  afterChange();
  return id;
}
async function saveMany(col, recs) {
  const now = new Date().toISOString();
  const docs = recs.map((r) => { const data = { ...r }; delete data.id; return { id: r.id || uuid(), col, data, updated_at: now, deleted: false, _dirty: 1 }; });
  await Store.putDocs(docs);
  afterChange();
}

/* ---------- Roles y sesión ---------- */
// Para agregar roles más adelante, define aquí qué secciones puede ver cada uno.
const ROLES = {
  admin: { label: 'Administrador', routes: '*' },
  // campo: { label: 'Operador de campo', routes: ['dashboard', 'alertas', 'bitacora', 'jornales', 'uso_maquinaria', 'clima', 'campana'] },
  // lectura: { label: 'Solo lectura', routes: ['dashboard', 'analitica', 'campanas', 'campana', 'finanzas'], readonly: true },
};
const Auth = {
  session: null,
  remoteCfg() { const c = Store.kv('remote', {}) || {}; return c.url && c.key ? c : null; },
  role() { return ROLES[this.session?.rol] || ROLES.admin; },
  can(route) { const r = this.role(); return r.routes === '*' || r.routes.includes(route); },
  async sha(s) {
    if (window.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
    }
    let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0; return 'h' + h; // respaldo sin crypto.subtle
  },
  async localCred() {
    let cred = Store.kv('cred_local');
    if (!cred) { cred = { user: 'admin', hash: await this.sha('admin:agro2026') }; await Store.setKV('cred_local', cred); }
    return cred;
  },
  async loginLocal(user, pass) {
    const cred = await this.localCred();
    const u = String(user || '').trim().toLowerCase();
    if (u !== cred.user || (await this.sha(`${cred.user}:${pass}`)) !== cred.hash) throw new Error('Usuario o contraseña incorrectos.');
    this.session = { mode: 'local', user: cred.user, nombre: 'Administrador', rol: 'admin' };
    await Store.setKV('session', this.session);
  },
  async changeLocalPassword(current, next) {
    const cred = await this.localCred();
    if ((await this.sha(`${cred.user}:${current}`)) !== cred.hash) throw new Error('La contraseña actual no es correcta.');
    if (String(next).length < 6) throw new Error('La nueva contraseña debe tener al menos 6 caracteres.');
    await Store.setKV('cred_local', { user: cred.user, hash: await this.sha(`${cred.user}:${next}`) });
  },
  async loginRemote(email, pass) {
    const c = this.remoteCfg();
    if (!navigator.onLine) throw new Error('Necesitas conexión para el primer inicio de sesión con el servidor.');
    let r;
    try {
      r = await fetch(`${c.url}/auth/v1/token?grant_type=password`, {
        method: 'POST', headers: { apikey: c.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: String(email).trim(), password: pass }),
      });
    } catch (e) { throw new Error('No se pudo contactar al servidor. Revisa la URL o tu conexión.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Correo o contraseña incorrectos.');
    this.session = {
      mode: 'remote', user: j.user?.email, nombre: j.user?.email, rol: 'admin', uid: j.user?.id,
      access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000,
    };
    try {
      const p = await Sync.api(`/rest/v1/perfiles?id=eq.${encodeURIComponent(j.user.id)}&select=rol,nombre`);
      if (p && p[0]) { this.session.rol = p[0].rol || 'admin'; this.session.nombre = p[0].nombre || this.session.nombre; }
    } catch (e) { /* la tabla de perfiles es opcional */ }
    await Store.setKV('session', this.session);
  },
  async ensureFresh() {
    const s = this.session;
    if (!s || s.mode !== 'remote') return;
    if (s.expires_at - 60000 > Date.now()) return;
    await this.refresh();
  },
  async refresh() {
    const c = this.remoteCfg(); const s = this.session;
    if (!c || !s?.refresh_token) throw new Error('Sesión no válida');
    const r = await fetch(`${c.url}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST', headers: { apikey: c.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { s.expired = true; await Store.setKV('session', s); throw new Error('La sesión expiró. Vuelve a iniciar sesión para sincronizar.'); }
    Object.assign(s, { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, expired: false });
    await Store.setKV('session', s);
  },
  async logout() {
    this.session = null;
    await Store.setKV('session', null);
    location.hash = '';
    UI.showLogin();
  },
};

/* ---------- Sincronización con Supabase (offline-first, última escritura gana) ---------- */
const Sync = {
  timer: null, running: false, lastError: null,
  pending() { let n = 0; for (const d of Store.docs.values()) if (d._dirty) n++; return n; },
  enabled() { return !!Auth.remoteCfg() && Auth.session?.mode === 'remote'; },
  schedule(ms = 2500) {
    clearTimeout(this.timer);
    if (this.enabled()) this.timer = setTimeout(() => this.run(), ms);
    if (typeof UI !== 'undefined') UI.updateSync();
  },
  async api(path, opts = {}, retry = true) {
    const c = Auth.remoteCfg();
    await Auth.ensureFresh();
    const headers = {
      apikey: c.key,
      Authorization: `Bearer ${Auth.session?.access_token || c.key}`,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    };
    const r = await fetch(c.url + path, { ...opts, headers });
    if (r.status === 401 && retry && Auth.session?.refresh_token) { await Auth.refresh(); return this.api(path, opts, false); }
    if (!r.ok) throw new Error(`Servidor respondió ${r.status}: ${(await r.text()).slice(0, 180)}`);
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  },
  async run({ full = false } = {}) {
    if (!this.enabled() || this.running) return;
    if (!navigator.onLine) { UI.updateSync(); return; }
    this.running = true; UI.updateSync();
    let changed = false;
    try {
      // 1) Subir cambios locales pendientes
      const dirty = [...Store.docs.values()].filter((d) => d._dirty);
      for (let i = 0; i < dirty.length; i += 200) {
        const batch = dirty.slice(i, i + 200);
        await this.api('/rest/v1/agro_registros?on_conflict=id', {
          method: 'POST',
          headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify(batch.map((d) => ({ id: d.id, coleccion: d.col, data: d.data, updated_at: d.updated_at, deleted: !!d.deleted }))),
        });
        const clean = batch
          .map((d) => { const cur = Store.docs.get(d.id); return cur && cur.updated_at === d.updated_at ? { ...cur, _dirty: 0 } : null; })
          .filter(Boolean);
        if (clean.length) await Store.putDocs(clean);
      }
      // 2) Descargar cambios de otros dispositivos (con 5 min de solape; la fusión es idempotente)
      const cursor = full ? null : Store.kv('sync_cursor', null);
      const since = cursor ? new Date(tms(cursor) - 5 * 60000).toISOString() : null;
      let maxTs = cursor; let offset = 0;
      for (;;) {
        const q = `/rest/v1/agro_registros?select=id,coleccion,data,updated_at,deleted,server_ts&order=server_ts.asc,id.asc&limit=1000&offset=${offset}` + (since ? `&server_ts=gt.${encodeURIComponent(since)}` : '');
        const rows = (await this.api(q)) || [];
        const merge = [];
        for (const r of rows) {
          const loc = Store.docs.get(r.id);
          const remoteNewer = !loc || tms(r.updated_at) >= tms(loc.updated_at);
          if (remoteNewer && (!loc || !loc._dirty || tms(r.updated_at) > tms(loc.updated_at))) {
            if (!loc || tms(loc.updated_at) !== tms(r.updated_at) || !!loc.deleted !== !!r.deleted) {
              merge.push({ id: r.id, col: r.coleccion, data: r.data || {}, updated_at: r.updated_at, deleted: !!r.deleted, _dirty: 0 });
            }
          }
          if (!maxTs || tms(r.server_ts) > tms(maxTs)) maxTs = r.server_ts;
        }
        if (merge.length) { await Store.putDocs(merge); changed = true; }
        if (rows.length < 1000) break;
        offset += 1000;
      }
      if (maxTs) await Store.setKV('sync_cursor', maxTs);
      await Store.setKV('last_sync', new Date().toISOString());
      this.lastError = null;
    } catch (e) {
      this.lastError = e.message;
      console.warn('Sync', e);
    } finally {
      this.running = false;
      UI.updateSync();
      if (changed) UI.softRefresh();
    }
  },
};

/* ---------- Cálculos ---------- */
function stockInsumo(id) {
  return Data.memo('stock:' + id, () => {
    const ins = byId('insumos', id); if (!ins) return 0;
    const entra = sum(where('compras', (c) => c.insumo_id === id), (c) => c.cantidad);
    const sale = sum(where('bitacora', (b) => b.insumo_id === id && b.estado !== 'Programada'), (b) => b.cantidad);
    return num(ins.stock_inicial) + entra - sale;
  });
}

function maquinaInfo(id) {
  return Data.memo('maq:' + id, () => {
    const m = byId('maquinaria', id) || {};
    const usos = where('uso_maquinaria', (u) => u.maquina_id === id);
    const horas = num(m.horometro_inicial) + sum(usos, (u) => u.horas);
    const prev = where('mantenimientos', (x) => x.maquina_id === id && x.tipo !== 'Correctivo');
    const ultimo = prev.length ? Math.max(...prev.map((x) => num(x.horometro))) : num(m.horometro_inicial);
    const intervalo = num(m.intervalo_mant_h);
    const desde = horas - ultimo;
    return {
      horas, ultimo, intervalo, desde,
      restante: intervalo ? intervalo - desde : null,
      pct: intervalo ? desde / intervalo : 0,
      litros: sum(usos, (u) => u.combustible_l),
      costoComb: sum(usos, (u) => u.costo_combustible),
    };
  });
}

function contratoEstado(r) {
  const t = today();
  if (r.fecha_fin && r.fecha_fin < t) return { txt: 'Vencido', cls: 'danger', dias: daysBetween(t, r.fecha_fin) };
  if (r.fecha_inicio && r.fecha_inicio > t) return { txt: 'Por iniciar', cls: 'info', dias: null };
  const d = r.fecha_fin ? daysBetween(t, r.fecha_fin) : null;
  const lim = num(r.alerta_dias) || S().dias_contrato;
  if (d !== null && d <= lim) return { txt: `Vence en ${d} d`, cls: 'warn', dias: d };
  return { txt: 'Vigente', cls: 'ok', dias: d };
}

// Resumen económico y productivo de una campaña (corazón de la analítica)
function resumen(c) {
  return Data.memo('res:' + c.id, () => {
    const lote = byId('lotes', c.lote_id);
    const area = num(c.area_sembrada) || num(lote?.hectareas);
    const bit = where('bitacora', (b) => b.campana_id === c.id && b.estado !== 'Programada');
    const insumos = sum(bit, (b) => b.costo);
    const jor = where('jornales', (j) => j.campana_id === c.id && j.estado !== 'Asignado');
    const manoObra = sum(jor, (j) => j.costo);
    const maquinaria = sum(where('uso_maquinaria', (u) => u.campana_id === c.id), (u) => u.costo_total);
    const servicios = sum(where('compras', (x) => x.campana_id === c.id && !x.insumo_id), (x) => x.costo_total);
    const otrosMov = sum(where('movimientos', (m) => m.campana_id === c.id && m.tipo === 'Egreso'), (m) => m.monto);
    const otros = servicios + otrosMov;
    const costo = insumos + manoObra + maquinaria + otros;
    const ventas = where('ventas', (v) => v.campana_id === c.id);
    const ingresos = sum(ventas, (v) => v.total) + sum(where('movimientos', (m) => m.campana_id === c.id && m.tipo === 'Ingreso'), (m) => m.monto);
    const kgVendidos = sum(ventas, (v) => v.cantidad_kg);
    const prod = num(c.produccion_kg) || kgVendidos;
    const margen = ingresos - costo;
    return {
      c, lote, area, anio: campanaAnio(c), cultivo: c.cultivo,
      insumos, manoObra, maquinaria, otros, costo, ingresos, prod, kgVendidos, margen,
      jornales: sum(jor, (j) => j.dias),
      roi: costo ? margen / costo : NaN,
      costoHa: area ? costo / area : NaN,
      kgHa: area && prod ? prod / area : NaN,
      costoKg: prod ? costo / prod : NaN,
      precioProm: kgVendidos ? sum(ventas, (v) => v.total) / kgVendidos : NaN,
      cerrada: ['Cosechada', 'Cerrada'].includes(c.estado),
    };
  });
}
const resumenes = () => Data.memo('resumenes', () => all('campanas').map(resumen));

function socioDeCampana(c) {
  return all('contratos').find((k) => k.tipo === 'Socio / asociación' && num(k.porcentaje) &&
    (!k.campana_id || k.campana_id === c.id) && (!k.lote_id || k.lote_id === c.lote_id) &&
    (!k.fecha_inicio || k.fecha_inicio <= (c.fecha_cosecha_real || c.fecha_cosecha_est || c.fecha_siembra || today())) &&
    (!k.fecha_fin || k.fecha_fin >= (c.fecha_siembra || today())));
}

    all('mantenimientos').filter((m) => num(m.costo)).forEach((m) => L.push({ fecha: m.fecha, fuente: 'Mantenimiento', col: 'mantenimientos', id: m.id, concepto: `${m.tipo}: ${lab('maquinaria', m.maquina_id)}`, ingreso: 0, egreso: num(m.costo), campana_id: null }));
    return L.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  });

/* ---------- Alertas inteligentes ---------- */
function computeAlerts() {
  return Data.memo('alerts', () => {
    const A = []; const t = today(); const cfg = S();
    // Bajo stock y vencimiento de insumos
    all('insumos').forEach((i) => {
      const st = stockInsumo(i.id);
      if (num(i.stock_minimo) && st <= num(i.stock_minimo)) A.push({ key: 'stock:' + i.id, lvl: st <= 0 ? 'alta' : 'media', tipo: 'Inventario', title: `Stock bajo: ${i.nombre}`, detail: `Quedan ${fmtNum(st, 1)} ${i.unidad || ''} (mínimo ${fmtNum(i.stock_minimo, 1)})`, col: 'insumos', id: i.id, act: 'comprar' });
      if (i.vencimiento && st > 0) { const d = daysBetween(t, i.vencimiento); if (d <= 30) A.push({ key: 'venc:' + i.id, lvl: d < 0 ? 'alta' : 'baja', tipo: 'Inventario', title: `${i.nombre} ${d < 0 ? 'vencido' : 'por vencer'}`, detail: d < 0 ? `Venció el ${fmtDate(i.vencimiento)}` : `Vence en ${d} días`, col: 'insumos', id: i.id }); }
    });
    // Próximas cosechas
    all('campanas').filter((c) => ['En curso', 'Planificada'].includes(c.estado) && c.fecha_cosecha_est).forEach((c) => {
      const d = daysBetween(t, c.fecha_cosecha_est);
      if (d < 0) A.push({ key: 'cos:' + c.id, lvl: 'media', tipo: 'Cosecha', title: `Cosecha atrasada: ${campanaLabel(c)}`, detail: `Estimada para el ${fmtDate(c.fecha_cosecha_est)}. Actualiza el estado o la fecha.`, route: ['campana', c.id] });
      else if (d <= cfg.dias_cosecha) A.push({ key: 'cos:' + c.id, lvl: d <= 5 ? 'alta' : 'media', tipo: 'Cosecha', title: `Cosecha en ${d} días: ${campanaLabel(c)}`, detail: `Fecha estimada ${fmtDate(c.fecha_cosecha_est)}. Prepara jornales, envases y comprador.`, route: ['campana', c.id] });
    });
    all('campanas').filter((c) => c.estado === 'Planificada' && c.fecha_siembra).forEach((c) => {
      const d = daysBetween(t, c.fecha_siembra);
      if (d >= 0 && d <= 15) A.push({ key: 'siem:' + c.id, lvl: 'baja', tipo: 'Siembra', title: `Siembra en ${d} días: ${campanaLabel(c)}`, detail: 'Revisa semilla y fertilizante de fondo en el inventario.', route: ['campana', c.id] });
    });
    // Contratos
    all('contratos').forEach((k) => {
      if (!k.fecha_fin) return;
      const d = daysBetween(t, k.fecha_fin);
      const lim = num(k.alerta_dias) || cfg.dias_contrato;
      const quien = lab('contactos', k.contacto_id);
      if (d < 0 && d >= -60) A.push({ key: 'con:' + k.id, lvl: 'alta', tipo: 'Contrato', title: `Contrato vencido: ${k.tipo}`, detail: `${quien}. Venció el ${fmtDate(k.fecha_fin)}.`, col: 'contratos', id: k.id });
      else if (d >= 0 && d <= lim) A.push({ key: 'con:' + k.id, lvl: d <= 7 ? 'alta' : 'media', tipo: 'Contrato', title: `Contrato vence en ${d} días: ${k.tipo}`, detail: `${quien}. Vence el ${fmtDate(k.fecha_fin)}.`, col: 'contratos', id: k.id });
    });
    // Aplicaciones pendientes
    all('bitacora').filter((b) => b.estado === 'Programada').forEach((b) => {
      const d = daysBetween(t, b.fecha);
      if (d <= cfg.dias_aplicacion) {
        const i = byId('insumos', b.insumo_id);
        const que = `${b.tipo}${i ? ' con ' + i.nombre : ''}`;
        A.push({ key: 'apl:' + b.id, lvl: d < 0 ? 'alta' : 'media', tipo: 'Aplicación', title: d < 0 ? `Labor atrasada: ${que}` : d === 0 ? `Para hoy: ${que}` : `En ${d} días: ${que}`, detail: `${lab('campanas', b.campana_id)}. Programada para el ${fmtDate(b.fecha)}.`, col: 'bitacora', id: b.id, act: 'realizar' });
      }
    });
    // Tareas asignadas para hoy o atrasadas
    const asig = where('jornales', (j) => j.estado === 'Asignado' && j.fecha <= t);
    if (asig.length) A.push({ key: 'tar:' + t, lvl: 'baja', tipo: 'Personal', title: `${asig.length} tarea(s) asignada(s) para hoy o atrasadas`, detail: 'Confírmalas como realizadas para registrar el costo.', route: ['jornales'] });
    // Mantenimiento
    all('maquinaria').filter((m) => m.estado !== 'De baja').forEach((m) => {
      const mi = maquinaInfo(m.id);
      if (mi.intervalo && mi.pct >= 0.9) A.push({ key: 'man:' + m.id, lvl: mi.pct >= 1 ? 'alta' : 'media', tipo: 'Maquinaria', title: `Mantenimiento ${mi.pct >= 1 ? 'vencido' : 'próximo'}: ${m.nombre}`, detail: `${fmtNum(mi.desde)} h desde el último servicio (cada ${fmtNum(mi.intervalo)} h).`, col: 'maquinaria', id: m.id, act: 'mantener' });
    });
    where('mantenimientos', (x) => x.proxima_fecha).forEach((x) => {
      const posteriores = where('mantenimientos', (y) => y.maquina_id === x.maquina_id && y.fecha > x.fecha).length;
      const d = daysBetween(t, x.proxima_fecha);
      if (!posteriores && d <= 7) A.push({ key: 'manf:' + x.id, lvl: d < 0 ? 'alta' : 'media', tipo: 'Maquinaria', title: `Revisión programada: ${lab('maquinaria', x.maquina_id)}`, detail: d < 0 ? `Atrasada desde el ${fmtDate(x.proxima_fecha)}` : `En ${d} días (${fmtDate(x.proxima_fecha)})`, col: 'maquinaria', id: x.maquina_id });
    });
    // Clima (pronóstico guardado)
    Clima.alerts().forEach((a) => A.push(a));
    const order = { alta: 0, media: 1, baja: 2 };
    return A.sort((a, b) => order[a.lvl] - order[b.lvl]);
  });
}

function deepMerge(a, b) {
  const out = Array.isArray(a) ? [...a] : { ...a };
  for (const [k, v] of Object.entries(b || {})) out[k] = v && typeof v === 'object' && !Array.isArray(v) && a && typeof a[k] === 'object' ? deepMerge(a[k], v) : v;
  return out;
}
function shortMoney(v) {
  const m = S().moneda || 'S/'; const a = Math.abs(v);
  if (a >= 1e6) return `${m} ${fmtNum(v / 1e6, 1)} M`;
  if (a >= 1e3) return `${m} ${fmtNum(v / 1e3, 0)} mil`;
  return `${m} ${fmtNum(v)}`;
}

/* ---------- Formularios genéricos ---------- */
function refOptions(fd, current) {
  const sc = SCHEMAS[fd.ref];
  let rows = all(fd.ref).filter((r) => !fd.refFilter || fd.refFilter(r) || r.id === current);
  rows = [...rows].sort(sc.sort || ((a, b) => sc.label(a).localeCompare(sc.label(b))));
  if (fd.ref === 'campanas') rows.sort((a, b) => (a.estado === 'En curso' ? 0 : 1) - (b.estado === 'En curso' ? 0 : 1));
  return rows.map((r) => `<option value="${r.id}" ${r.id === current ? 'selected' : ''}>${esc(sc.label(r))}</option>`).join('');
}
function fieldHtml(fd, val, isNew) {
  const id = `f_${fd.name}`;
  const req = fd.req ? ' <span class="req" aria-hidden="true">*</span>' : '';
  const r = fd.req ? 'required' : '';
  let input;
  if (fd.type === 'textarea') input = `<textarea id="${id}" name="${fd.name}" ${r}>${esc(val)}</textarea>`;
  else if (fd.type === 'select') {
    const blank = fd.req && fd.def ? '' : '<option value="">Sin especificar</option>';
    input = `<select id="${id}" name="${fd.name}" ${r}>${blank}${fd.options.map((o) => `<option ${String(val) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if (fd.type === 'ref') {
    const n = all(fd.ref).length;
    input = `<select id="${id}" name="${fd.name}" ${r}><option value="">${fd.req ? 'Elige una opción' : 'Ninguno'}</option>${refOptions(fd, val)}</select>`;
    if (!n) input += `<span class="help">Aún no hay registros. <a href="#${fd.ref}" data-act="goto" data-id="${fd.ref}">Crear ${esc(SCHEMAS[fd.ref].singular)}</a></span>`;
  } else if (fd.type === 'number') input = `<input id="${id}" name="${fd.name}" type="number" step="any" inputmode="decimal" value="${val ?? ''}" ${r}>`;
  else if (fd.type === 'date') input = `<input id="${id}" name="${fd.name}" type="date" value="${esc(val)}" ${r}>`;
  else {
    const list = fd.suggest ? `list="dl_${fd.name}"` : '';
    input = `<input id="${id}" name="${fd.name}" type="text" value="${esc(val)}" ${list} ${r} autocomplete="off">` +
      (fd.suggest ? `<datalist id="dl_${fd.name}">${fd.suggest.map((s) => `<option value="${esc(s)}">`).join('')}</datalist>` : '');
  }
  const help = fd.help ? `<span class="help">${esc(fd.help)}</span>` : '';
  return `<div class="field ${fd.full || fd.type === 'textarea' ? 'full' : ''}"><label for="${id}">${esc(fd.label)}${req}</label>${input}${help}</div>`;
}
function readForm(form, sc) {
  const o = {};
  for (const fd of sc.fields) {
    const el = form.elements[fd.name]; if (!el) continue;
    let v = el.value;
    if (fd.type === 'number') v = v === '' ? null : Number(v);
    else v = String(v).trim();
    o[fd.name] = v;
  }
  return o;
}
function newDefaults(sc, preset) {
  const o = {};
  const lastC = Store.kv('last_campana');
  for (const fd of sc.fields) {
    if (fd.def !== undefined) o[fd.name] = fd.def;
    if (fd.type === 'date' && fd.req) o[fd.name] = today();
    if (fd.remember && lastC && byId('campanas', lastC)) o[fd.name] = lastC;
  }
  return { ...o, ...preset };
}
function openForm(col, id = null, preset = {}) {

  Modal.open({ title: id ? `Editar ${sc.singular}` : `Registrar ${sc.singular}`, body, foot });
  const form = $('#recForm');

  form.addEventListener('submit', async (ev) => {

/* ---------- Listas genéricas ---------- */
const FILTER_FIELD = { campana: 'campana_id', maquina: 'maquina_id', trabajador: 'trabajador_id' };
function filterControls(col) {
  const sc = SCHEMAS[col]; const st = UI.filters[col] || {};
  const sel = (key, label, opts) => `<select data-filter="${key}" aria-label="${esc(label)}"><option value="">${esc(label)}</option>${opts.map(([v, t]) => `<option value="${esc(v)}" ${String(st[key] ?? '') === String(v) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  const out = [`<div class="search">${ico('search')}<input type="search" data-filter="q" placeholder="Buscar en ${esc(sc.title.toLowerCase())}" value="${esc(st.q || '')}"></div>`];
  (sc.filters || []).forEach((k) => {
    if (k === 'campana') out.push(sel(k, 'Todas las campañas', all('campanas').sort(SCHEMAS.campanas.sort).map((c) => [c.id, campanaLabel(c)])));
    else if (k === 'maquina') out.push(sel(k, 'Todos los equipos', all('maquinaria').map((m) => [m.id, m.nombre])));
    else if (k === 'trabajador') out.push(sel(k, 'Todos los trabajadores', all('trabajadores').map((m) => [m.id, m.nombre])));
    else if (k === 'anio') {
      const years = [...new Set(all(col).map((r) => (col === 'campanas' ? campanaAnio(r) : yearOf(r[sc.dateField]))).filter(Boolean))].sort((a, b) => b - a);
      out.push(sel(k, 'Todos los años', years.map((y) => [y, y])));
    } else if (k === 'cultivo') out.push(sel(k, 'Todos los cultivos', [...new Set(all('campanas').map((c) => c.cultivo).filter(Boolean))].sort().map((c) => [c, c])));
    else { const fd = sc.fields.find((x) => x.name === k); if (fd?.options) out.push(sel(k, fd.label + ': todos', fd.options.map((o) => [o, o]))); }
  });
  return `<div class="filters" data-col="${col}">${out.join('')}</div>`;
}
function filteredRows(col, base) {
  const sc = SCHEMAS[col]; const st = UI.filters[col] || {};
  let rows = base ? [...base] : [...all(col)];
  for (const [k, v] of Object.entries(st)) {
    if (v === '' || v === undefined || v === null || k === 'q') continue;
    if (k === 'anio') rows = rows.filter((r) => String(col === 'campanas' ? campanaAnio(r) : yearOf(r[sc.dateField])) === String(v));
    else { const fk = FILTER_FIELD[k] || k; rows = rows.filter((r) => String(r[fk] ?? '') === String(v)); }
  }
  if (st.q) {
    const q = st.q.toLowerCase();
    rows = rows.filter((r) => sc.cols.map((c) => (c.render ? c.render(r) : r[c.k])).join(' ').replace(/<[^>]+>/g, ' ').toLowerCase().includes(q));
  }
  rows.sort(sc.sort || ((a, b) => String(b[sc.dateField] || '').localeCompare(String(a[sc.dateField] || ''))));
  return rows;
}
function tableHtml(cols, rows, { rowAttr = () => '', foot = '', empty = '', cards = true } = {}) {
  if (!rows.length) return `<div class="table-wrap"><div class="empty">${empty || 'No hay registros con estos filtros.'}</div></div>`;
  const head = cols.map((c) => `<th class="${c.n ? 'n' : ''}">${esc(c.label)}</th>`).join('');
  const body = rows.map((r) => `<tr ${rowAttr(r)}>${cols.map((c) => `<td class="${c.n ? 'n' : ''}" data-label="${esc(c.label)}">${c.render ? c.render(r) : esc(r[c.k] ?? '—') || '—'}</td>`).join('')}</tr>`).join('');
  return `<div class="table-wrap ${cards ? 'cards' : ''}"><table class="data"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;
}
function listTable(col, limit = 300) {
  const sc = SCHEMAS[col];
  const rows = filteredRows(col);
  const shown = rows.slice(0, limit);
  const more = rows.length > limit ? `<p class="small muted">Se muestran ${limit} de ${rows.length} registros. Usa los filtros para acotar.</p>` : '';
  const empty = all(col).length ? 'No hay registros con estos filtros.' : `Todavía no hay ${esc(sc.title.toLowerCase())}.<br><button class="btn primary" data-new="${col}">${ico('plus')} Registrar ${esc(sc.singular)}</button>`;
  return tableHtml(sc.cols, shown, { rowAttr: (r) => `class="click" data-open="${col}:${r.id}" tabindex="0"`, empty }) + more;
}
function pageHead(title, desc, actions = '') {
  return `<div class="page-head"><div class="t"><h2>${esc(title)}</h2>${desc ? `<p>${desc}</p>` : ''}</div><div class="actions">${actions}</div></div>`;
}
const newBtn = (col, label, preset = null, cls = 'primary') => `<button class="btn ${cls}" data-new="${col}" ${preset ? `data-preset='${esc(JSON.stringify(preset))}'` : ''}>${ico('plus')} ${esc(label || 'Registrar ' + SCHEMAS[col].singular)}</button>`;

function viewList(col) {
  const sc = SCHEMAS[col];

}

/* ---------- Router ---------- */
function go(route, param) {
  const h = param ? `${route}-${param}` : route;
  if (location.hash.slice(1) === h) render(); else location.hash = h;
}
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^([a-z_]+)(?:-(.+))?$/);
  return m ? [m[1], m[2]] : ['dashboard'];
}
function render() {
  if (!Auth.session) return;
  let [route, param] = parseHash();
  const mk = (r) => ROUTES[r] || (SCHEMAS[r] ? { title: SCHEMAS[r].title, render: () => viewList(r), nav: NAV_PARENT[r] || r } : null);
  if (!mk(route) || !Auth.can(route)) { route = 'dashboard'; param = null; }
  const view = mk(route);
  Charts.destroyAll(); _post = [];
  UI.current = { route, param };
  let html;
  try { html = view.render(param); }
  catch (e) { console.error(e); html = `<div class="page"><div class="banner warn">No se pudo mostrar esta sección: ${esc(e.message)}</div></div>`; }
  $('#view').innerHTML = html;
  $('#view').scrollTop = 0;
  $('#pageTitle').textContent = view.titleFn ? view.titleFn(param) : view.title;
  document.title = `${$('#pageTitle').textContent} | AgroGestión`;
  const navKey = view.nav || route;
  $$('#sidebar a[data-route]').forEach((a) => a.classList.toggle('active', a.dataset.route === navKey));
  $$('#bottomnav button[data-route]').forEach((b) => b.classList.toggle('active', b.dataset.route === navKey));
  UI.closeDrawer();
  const fns = _post; _post = [];
  fns.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act],[data-new],[data-edit],[data-open],[data-go]');
  if (!t) { if (e.target.classList?.contains('modal-back')) Modal.close(); return; }
  if (t.dataset.new) {
    const preset = t.dataset.preset ? JSON.parse(t.dataset.preset) : {};
    if (t.dataset.close) Modal.close();
    openForm(t.dataset.new, null, preset); return;
  }
  if (t.dataset.edit) { const [c, id] = t.dataset.edit.split(':'); openForm(c, id); return; }
  if (t.dataset.open) {
    const [c, id] = t.dataset.open.split(':'); const sc = SCHEMAS[c]; const r = byId(c, id);
    if (sc?.open && r) sc.open(r); else openForm(c, id); return;
  }
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go, t.dataset.id); return; }
  const act = t.dataset.act; const id = t.dataset.id;
  const H = ACTIONS[act];
  if (H) { e.preventDefault(); try { await H(t, id); } catch (err) { toast(err.message, 'error'); } }
});
document.addEventListener('keydown', (e) => {

/* ---------- Franja de campaña (siembra → cosecha con marcador de hoy) ---------- */
function seasonRow(c) {
  const ini = c.fecha_siembra; const fin = c.fecha_cosecha_real || c.fecha_cosecha_est; const t = today();
  const r = resumen(c);
  let pct = 0; let meta = '—'; let sub = '';
  if (ini && fin) {
    const total = Math.max(1, daysBetween(ini, fin)); const el = daysBetween(ini, t);
    pct = Math.max(0, Math.min(1, el / total));
    if (el < 0) { meta = `${-el} d`; sub = 'para sembrar'; }
    else if (t > fin) { meta = c.fecha_cosecha_real ? 'Cosechada' : `${daysBetween(fin, t)} d`; sub = c.fecha_cosecha_real ? fmtDate(fin) : 'de atraso'; }
    else { meta = `${daysBetween(t, fin)} d`; sub = 'para cosecha'; }
  } else if (ini) { meta = `Día ${Math.max(0, daysBetween(ini, t))}`; sub = 'sin fecha de cosecha'; pct = 0.5; }
  const rightOnGrow = pct > 0.82 ? 'style="color:var(--primary-ink)"' : '';
  return `<div class="season-row" data-go="campana" data-id="${c.id}" role="link" tabindex="0">
    <div class="season-name">${esc(c.cultivo)}${c.variedad ? ' ' + esc(c.variedad) : ''}<small>${esc(r.lote?.nombre || 'Sin lote')}, ${fmtNum(r.area, 1)} ha</small></div>
    <div class="season-track" title="Siembra ${fmtDate(ini)}, cosecha ${fmtDate(fin)}">
      <div class="season-grow" style="width:${pct * 100}%"></div>
      <div class="season-today" style="left:calc(${pct * 100}% - 1px)"></div>
      <div class="season-label"><span>${pct > 0.2 ? 'Siembra ' + fmtDate(ini).slice(0, 5) : ''}</span><span ${rightOnGrow}>${fin ? 'Cosecha ' + fmtDate(fin).slice(0, 5) : ''}</span></div>
    </div>
    <div class="season-meta">${meta}<small>${sub}</small></div></div>`;
}

  return `<div class="alert ${a.lvl}"><span class="lvl"></span><div><div class="alert-title">${esc(a.title)}</div><div class="alert-detail">${esc(a.tipo)}. ${esc(a.detail)}</div></div><div class="actions">${act}</div></div>`;
